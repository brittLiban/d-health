# DHealth Native Demo — an OVERLAY on the canonical Native deployment (DH-DEMO-001, re-shaped by
# DHEALTH-NATIVE-DEPLOY-001).
#
#     docker compose -f docker-compose.native.yml -f docker-compose.native-demo.yml \
#         --env-file demo/native/demo.env up -d
#
# (`scripts/demo/up.sh` is the supported way to say that.)
#
# What changed, and why it matters. This file used to be the ONLY place a standalone DHealth
# Native topology existed, and it built one by `extends:`-ing services out of docker-compose.yml.
# That worked, and it is how DH-DEMO-001 proved Native could boot without OpenMRS/OpenELIS -- but
# Compose's `extends` merges `depends_on` from the base file and gives a local override no way to
# remove an entry, so every extended service arrived carrying the maternity track's dependency
# graph. The result was a demo with a PostgreSQL service named `openelis-db`, aliased to
# `db.openelis.org`, running no OpenELIS at all.
#
# `docker-compose.native.yml` is now the product topology, written in its own terms. This file is
# what it always should have been: the demo's own additions on top of it.
#
#     Native production topology  +  demo users  +  demo seed authority  +  demo credentials
#                                 =  Native demo
#
# **RESET SAFETY IS STILL P0 and is unchanged.** `demo_seed.py` refuses to clear a single row
# unless all three independent facts hold: the connected database is named `dhealth_native_demo`
# (set below, never by the production file), the `dhealth_demo_environment` marker row exists
# (created only by this project's own db-init run), and `ADAPTER_DEMO_ENVIRONMENT=1` is in the
# adapter's own environment (set below, and nowhere else in this repository). A production Native
# deployment satisfies none of them, which
# `adapter/tests/test_native_deployment_topology.py` asserts structurally.
#
# Its own project name and its own volumes, so `scripts/demo/down.sh -v` can only ever remove this
# demo's data -- never the production deployment's, never the maternity track's.
name: dhealth-native-demo

services:
  dhealth-db:
    environment:
      # The demo's own database name. One of `demo_seed.py`'s three safety facts.
      ADAPTER_DB_NAME: ${ADAPTER_DB_NAME:-dhealth_native_demo}
    volumes:
      # Demo data, in a demo volume. Named so it cannot collide with the production deployment's.
      - native-demo-db-data:/var/lib/postgresql/data
      - ./deploy/native/db-init/init-tenant-databases.sh:/docker-entrypoint-initdb.d/init-tenant-databases.sh:ro
      # The marker table only this demo ever creates -- the second of the three safety facts.
      - ./demo/native/db-init/mark-demo-environment.sh:/docker-entrypoint-initdb.d/zz-mark-demo-environment.sh:ro

  dhealth-db-hardening:
    environment:
      ADAPTER_DB_NAME: ${ADAPTER_DB_NAME:-dhealth_native_demo}

  # Reconciles the three fixed-username demo Keycloak users -- additive and idempotent, the same
  # convergence idiom the Exchange client reconciler uses, never a realm import. It creates
  # accounts; it does not weaken authentication. Every demo login goes through the same real
  # Authorization Code + PKCE path a production login does.
  keycloak-demo-users:
    image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    restart: "no"
    read_only: true
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/daher/reconcile-demo-users.sh"]
    environment:
      TZ: ${TZ:-Africa/Djibouti}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in demo.env}
      DEMO_CLINICIAN_USERNAME: ${DEMO_CLINICIAN_USERNAME:-demo-clinician}
      DEMO_CLINICIAN_PASSWORD: ${DEMO_CLINICIAN_PASSWORD:?set DEMO_CLINICIAN_PASSWORD in demo.env}
      DEMO_LAB_TECH_USERNAME: ${DEMO_LAB_TECH_USERNAME:-demo-lab-tech}
      DEMO_LAB_TECH_PASSWORD: ${DEMO_LAB_TECH_PASSWORD:?set DEMO_LAB_TECH_PASSWORD in demo.env}
      DEMO_RELEASER_USERNAME: ${DEMO_RELEASER_USERNAME:-demo-releaser}
      DEMO_RELEASER_PASSWORD: ${DEMO_RELEASER_PASSWORD:?set DEMO_RELEASER_PASSWORD in demo.env}
    volumes:
      - ./keycloak/reconcile-demo-users.sh:/opt/daher/reconcile-demo-users.sh:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    networks: [internal]

  adapter:
    depends_on:
      # The demo's own extra dependency: the three demo accounts must exist before `demo_seed.py`
      # can discover each one's Keycloak-assigned `sub`.
      keycloak-demo-users:
        condition: service_completed_successfully
    environment:
      ADAPTER_DB_NAME: ${ADAPTER_DB_NAME:-dhealth_native_demo}
      # The ONLY place in this repository that sets this. The third of `demo_seed.py`'s three
      # independent safety facts, and the one a production deployment can never satisfy by
      # accident.
      ADAPTER_DEMO_ENVIRONMENT: ${ADAPTER_DEMO_ENVIRONMENT:?set ADAPTER_DEMO_ENVIRONMENT=1 in demo.env}
      # Read only by `demo_seed.py`, never by the running FastAPI app: the real adapter never
      # talks to Keycloak's admin API.
      DEMO_KEYCLOAK_ADMIN_URL: http://keycloak:8080
      DEMO_KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      DEMO_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in demo.env}
      DEMO_CLINICIAN_USERNAME: ${DEMO_CLINICIAN_USERNAME:-demo-clinician}
      DEMO_LAB_TECH_USERNAME: ${DEMO_LAB_TECH_USERNAME:-demo-lab-tech}
      DEMO_RELEASER_USERNAME: ${DEMO_RELEASER_USERNAME:-demo-releaser}

  caddy:
    volumes:
      - ./deploy/native/Caddyfile:/etc/caddy/Caddyfile:ro
      - native-demo-caddy-data:/data
      - native-demo-caddy-config:/config

volumes:
  native-demo-db-data:
  native-demo-caddy-data:
  native-demo-caddy-config:
  # Declared because the production file's `adapter` service mounts it. Demo-scoped like every
  # other volume here, because the project name scopes it.
  adapter-audit:
