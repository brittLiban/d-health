# Daher Health — v1 pilot stack
#
# Built incrementally, one service group at a time (see docs/ARCHITECTURE.md §13).
# Includes steps 1 (OpenMRS), 3 (OpenELIS), 4a (Keycloak), DH-010 adapter
# safety skeleton, DH-014 backup (opt-in profile), DH-020 database hardening,
# and DH-024 fresh-deployment guards.
#
# Every image is pinned. No `:latest` anywhere. Where an upstream publishes only a
# moving branch tag (the O3 images), the tag is pinned AND accompanied by a digest so
# the deployment is reproducible even though the tag is not.
#
#   Digests below were pulled and recorded on 2026-08-10 (DH-002). They are the
#   repository digests reported by the registry, not image IDs. Re-pinning after an
#   intentional upgrade means pulling again and copying the new digest — never
#   hand-editing one. Also recorded in docs/ARCHITECTURE.md §12.
#
# Versions and the reasoning behind them: docs/ARCHITECTURE.md §12.

# ⚠️ MULTI-FACILITY (DH-026). The project name namespaces every container, volume
# and network, so it is what keeps two facilities on one host from colliding.
# FACILITY_ID must be unique per facility and stable for the life of that
# deployment — changing it later orphans the volumes, which on a clinical stack
# means orphaning the patient database. It is not a display name; it is an
# identity. Lowercase alphanumeric and hyphens only (Compose restriction).
name: daher-${FACILITY_ID:-default}

x-common-env: &common-env
  TZ: ${TZ:-Africa/Djibouti}

services:

  # ---------------------------------------------------------------------------
  # OpenMRS database — MariaDB.
  #
  # MariaDB rather than PostgreSQL: OpenMRS module SQL assumes MySQL. See
  # docs/ARCHITECTURE.md §3 for why the brief's "one PostgreSQL" was not viable.
  #
  # 10.11 (not 11.x) because that is the line the OpenMRS reference distribution
  # tests against. Following upstream's tested pairing beats picking the newer LTS.
  # ---------------------------------------------------------------------------
  openmrs-db:
    image: mariadb:10.11.18@sha256:de61fed4a40d3842f3ee09944ba52792156cfd9adf489b2cc670fc6ded28df8d
    restart: unless-stopped
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    environment:
      <<: *common-env
      MYSQL_DATABASE: ${OMRS_DB_NAME:?set OMRS_DB_NAME in .env}
      MYSQL_USER: ${OMRS_DB_USER:?set OMRS_DB_USER in .env}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:?set OMRS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${OMRS_DB_ROOT_PASSWORD:?set OMRS_DB_ROOT_PASSWORD in .env}
    volumes:
      - openmrs-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute="SELECT 1;" $$MYSQL_DATABASE
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal]

  # Demo patients are generated by an upstream startup task, before Initializer
  # has finished adding the metadata that task needs. A first boot with both
  # switches `on` therefore resets the trigger but creates zero patients. Enforce
  # the demonstrated two-stage workflow: initialize content with patients off,
  # then enable patients on a later boot. The default off path does not query.
  openmrs-demo-preflight:
    image: mariadb:10.11.18@sha256:de61fed4a40d3842f3ee09944ba52792156cfd9adf489b2cc670fc6ded28df8d
    restart: "no"
    depends_on:
      openmrs-db:
        condition: service_healthy
    environment:
      <<: *common-env
      OMRS_DB_HOST: openmrs-db
      OMRS_DB_NAME: ${OMRS_DB_NAME:?set OMRS_DB_NAME in .env}
      OMRS_DB_USER: ${OMRS_DB_USER:?set OMRS_DB_USER in .env}
      OMRS_DB_PASSWORD: ${OMRS_DB_PASSWORD:?set OMRS_DB_PASSWORD in .env}
    entrypoint: ["/bin/sh", "/usr/local/bin/validate-demo-readiness"]
    read_only: true
    volumes:
      - ./openmrs-config/demo/patients.${OMRS_DEMO_PATIENTS:-off}.xml:/demo-control/patients.xml:ro
      - ./openmrs-config/validate-demo-readiness.sh:/usr/local/bin/validate-demo-readiness:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [internal]

  # ---------------------------------------------------------------------------
  # OpenMRS backend — Tomcat, REST + FHIR R4 API, modules.
  #
  # Not publicly routed. Reached through the gateway (and later, Caddy).
  # ---------------------------------------------------------------------------
  openmrs-backend:
    image: daher-health/openmrs-backend:3.7-${OMRS_DEMO_CONTENT:-on}
    build:
      context: ./openmrs-config
      target: ${OMRS_DEMO_CONTENT:-on}
    restart: unless-stopped
    depends_on:
      openmrs-db:
        condition: service_healthy
      openmrs-demo-preflight:
        condition: service_completed_successfully
      keycloak-sso-config:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: openmrs-db
      OMRS_CONFIG_CONNECTION_DATABASE: ${OMRS_DB_NAME}
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD}
      # Admin account password. ⚠️ APPLIED ON FIRST BOOT ONLY — it is written into
      # the database when OpenMRS initialises an empty schema. Setting it against an
      # already-initialised volume does nothing; recovery is then a manual password
      # change, not an .env edit.
      #
      # Without this, the image defaults to the published value `Admin123`
      # (`OMRS_ADMIN_USER_PASSWORD=${OMRS_ADMIN_USER_PASSWORD:-Admin123}` in the
      # image's /openmrs/startup-init.sh). The `:?` guard is deliberate: a missing
      # value must fail loudly at `up`, because the alternative is silently shipping
      # a known admin password — and the failure would only be noticed by whoever
      # found it first.
      OMRS_CONFIG_ADMIN_USER_PASSWORD: ${OMRS_ADMIN_PASSWORD:?set OMRS_ADMIN_PASSWORD in .env}
      # ⚠️ VERIFIED INERT AT DH-002. This variable does nothing in this image.
      # `grep -oE "OMRS_[A-Z_]+" /openmrs/startup-init.sh /openmrs/startup.sh`
      # inside the backend container lists every OMRS_* name those scripts read,
      # and OMRS_CONFIG_ADD_DEMO_DATA is not among them. That grep covers the two
      # startup scripts only — it does not prove no other mechanism exists — so
      # the variable is kept, pinned to false, rather than removed.
      #
      # Practical consequence: do NOT rely on this to keep demo data out. No demo
      # patients appeared on a boot with it set to false, but that is the default
      # behaviour, not this switch working.
      OMRS_CONFIG_ADD_DEMO_DATA: ${OMRS_ADD_DEMO_DATA:-false}
      # DH-008 is deliberately fail-closed until Liban approves the application
      # role/provider mapping. The OMOD remains installed while false, but its
      # activator unloads it and the local break-glass login stays available.
      SSO_ENABLED: ${SSO_ENABLED:-false}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.openelis.org:8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak.openelis.org:8080
      KEYCLOAK_OPENMRS_CLIENT_SECRET: ${KEYCLOAK_OPENMRS_CLIENT_SECRET:?set in .env}
      # Initializer 2.12 has no bed or bed-type domains. Some loaders also
      # ignore its filename-exclusion API, so OMRS_DEMO_CONTENT selects a local
      # image build target rather than pretending that API covers every domain.
    volumes:
      - openmrs-data:/openmrs/data
      - ./openmrs-config/initializer/globalproperties:/openmrs/distribution/openmrs_config/globalproperties/zz-daher-health:ro
      - ./openmrs-config/initializer/locations:/openmrs/distribution/openmrs_config/locations/zz-daher-health:ro
      - ./openmrs-config/initializer/roles:/openmrs/distribution/openmrs_config/roles/zz-daher-health:ro
      - ./openmrs-config/initializer/visittypes:/openmrs/distribution/openmrs_config/visittypes/zz-daher-health:ro
      - ./openmrs-config/initializer/encountertypes:/openmrs/distribution/openmrs_config/encountertypes/zz-daher-health:ro
      - ./openmrs-config/initializer/attributetypes:/openmrs/distribution/openmrs_config/attributetypes/zz-daher-health:ro
      - ./openmrs-config/demo/patients.${OMRS_DEMO_PATIENTS:-off}.xml:/openmrs/distribution/openmrs_config/globalproperties/zz-daher-patient-control/patients.xml:ro
      # ---- Demo patients: on/off switch (BLOCKER-2) --------------------------
      # The O3 distro can create 50 fictional patients on first boot. The local
      # derived image removes upstream's competing writer for that global property;
      # this mounted overlay is therefore the sole authoritative on/off value.
      #
      # Why a separate file: upstream's file also carries unrelated properties
      # (queue concept sets, cause-of-death, attachment extensions). Replacing it
      # merely to control patient creation couples two independent settings. The
      # unique filename also survives OMRS_DEMO_CONTENT=off.
      #
      # ⚠️ CHOOSE BEFORE FIRST BOOT. The module zeroes the property after it fires,
      # and Initializer leaves an unchanged file alone. Flipping `off` to `on`
      # changes the file checksum and can inject 50 fictional patients into an
      # existing database — why the default is `off` and `on` is deliberate.
      #
      # MOUNTED AT THE DISTRIBUTION SOURCE, NOT THE LIVE CONFIG DIRECTORY. The
      # entrypoint deletes and re-copies /openmrs/data/configuration from
      # /openmrs/distribution/openmrs_config on EVERY boot ("Deleting modules,
      # OWAs, configuration and frontend"). Mounting into the destination made the
      # copy fail with "Permission denied" and crash-looped the container — found
      # by doing exactly that. Mounting the source is read-only by nature, so the
      # copy succeeds and carries our version forward.
    # Readiness, not liveness. The previous probe (`curl -f http://localhost:8080/openmrs`)
    # reported HEALTHY 8 seconds into the first boot, while Liquibase was still running and
    # the gateway was returning 502 — measured at DH-002. Two reasons it lied:
    #
    #   1. `curl -f` only fails on HTTP >= 400. That URL answers 302 during startup, which
    #      `-f` treats as success. Changing the URL alone would not have fixed it.
    #   2. `/openmrs` is served by Tomcat before OpenMRS itself has finished starting.
    #
    # So this asserts an explicit 200 from the REST session endpoint, which only answers once
    # the OpenMRS application context is up. This matters beyond cosmetics: DH-005 and DH-007
    # hang `depends_on: condition: service_healthy` off this container, and a probe that goes
    # green early would start those services against an OpenMRS that cannot serve them.
    #
    # Timings come from a measured cold boot at DH-002: 49 minutes on 4 vCPU / 30 GB, almost
    # all of it importing the distro's 23 OCL concept packages. start_period 30m + 60x30s
    # tolerates ~60 minutes before the container is called unhealthy. Deliberately generous:
    # nothing restarts on unhealthy, so the cost of being too tight is a misleading red
    # status that invites someone to "fix" a working system mid-import.
    # UI-009/DH-008D: the REST session endpoint above returns 200 whether or not anyone can
    # actually log in -- {"authenticated":false} is itself a 200. Measured directly this
    # ticket: a database where oauth2login never activates (SSO_ENABLED=true but the module
    # can't start) still answers /ws/rest/v1/session with 200, so the healthcheck above alone
    # goes green in a state where staff cannot authenticate at all -- a false-green facility
    # status. Gated strictly on SSO_ENABLED so this is a no-op in the live stack's current
    # SSO-off mode: when SSO is on, also require /oauth2login to redirect toward the
    # configured identity provider rather than OpenMRS's own setup wizard (the same
    # redirect-target check activate-oauth2login-if-needed.sh uses). This is local
    # configured-auth-path readiness, not Keycloak reachability -- constructing that redirect
    # never contacts the identity provider (measured this ticket with the identity provider
    # host absent entirely), so this does not turn container health into a dependency on an
    # external service staying continuously online.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          test "$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/openmrs/ws/rest/v1/session)" = "200" || exit 1
          if [ "$$SSO_ENABLED" = "true" ]; then
            loc=$$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/openmrs/oauth2login)
            case "$$loc" in
              *initialsetup*|"") exit 1 ;;
            esac
          fi
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 1800s
    networks:
      internal:
        # The gateway image's nginx config hard-codes `http://backend:8080` — it is
        # not templated from an env var (verified in the image at DH-002:
        # /etc/nginx/templates/default.conf.template). Upstream's own compose names
        # the service `backend`; ours is named for the service group it belongs to.
        # An alias satisfies upstream's baked-in routing without us renaming services
        # or hand-editing someone else's nginx config — same reasoning as ADR-010.
        aliases: [backend]

  # Initializer 2.12 has no bed or bed-type domain. This short-lived job uses
  # bedmanagement 7.2.0's REST resources after the backend is genuinely ready.
  # It can create only: conflicts fail, and no update/delete operation exists.
  openmrs-maternity-config:
    image: python:3.13.14-slim-bookworm@sha256:67a1e1f215ccda113cfc024e8639049257e88f273898f595b61476d128d387e8
    restart: "no"
    read_only: true
    user: "65534:65534"
    depends_on:
      openmrs-backend:
        condition: service_healthy
    environment:
      <<: *common-env
      OPENMRS_API_URL: http://openmrs-backend:8080/openmrs/ws/rest/v1/
      OPENMRS_ADMIN_PASSWORD: ${OMRS_ADMIN_PASSWORD:?set OMRS_ADMIN_PASSWORD in .env}
      MATERNITY_DELIVERY_BEDS: ${MATERNITY_DELIVERY_BEDS:-0}
      MATERNITY_POSTPARTUM_BEDS: ${MATERNITY_POSTPARTUM_BEDS:-0}
    volumes:
      - ./openmrs-config/seed/seed_maternity.py:/opt/daher/seed_maternity.py:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    command: ["python", "/opt/daher/seed_maternity.py"]
    cap_drop: [ALL]
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Prenatal lab order set (DH-006).
  #
  # ⚠️ This ships the panel EMPTY, and that is the correct state — not an
  # unfinished one. Neither OpenMRS nor OpenELIS ships a prenatal panel to copy
  # unmodified (checked: OpenMRS had zero order sets, OpenELIS's four panels are
  # Bilan Biochimique / NFS / Serologie VIH / Typage lymphocytaire). So the panel
  # has to be COMPOSED, and composing it is a clinical decision reserved to the
  # clinical lead — AGENTS.md, NEEDS LIBAN #9.
  #
  # The mechanism exists now so that when docs/CLINICAL-SIGNOFF.md comes back,
  # the answer is applied verbatim rather than transcribed by judgement. Members
  # are added; a member present in OpenMRS but absent from the file is NEVER
  # removed, because it may already have been used to order tests for a patient
  # (same reasoning as ADR-007's beds).
  #
  # Initializer 2.12.0 has no order-set domain, so this uses the native REST
  # seam exactly as DH-003 did for beds.
  # ---------------------------------------------------------------------------
  openmrs-prenatal-panel:
    image: python:3.13.14-slim-bookworm@sha256:67a1e1f215ccda113cfc024e8639049257e88f273898f595b61476d128d387e8
    restart: "no"
    read_only: true
    user: "65534:65534"
    depends_on:
      openmrs-backend:
        condition: service_healthy
      openmrs-maternity-config:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      OPENMRS_BASE_URL: http://openmrs-backend:8080/openmrs/ws/rest/v1/
      OPENMRS_USERNAME: admin
      OPENMRS_ADMIN_PASSWORD: ${OMRS_ADMIN_PASSWORD:?set OMRS_ADMIN_PASSWORD in .env}
      PRENATAL_PANEL_MEMBERS: /opt/daher/prenatal-panel.members.csv
    volumes:
      - ./openmrs-config/seed/seed_prenatal_panel.py:/opt/daher/seed_prenatal_panel.py:ro
      - ./openmrs-config/seed/prenatal-panel.members.csv:/opt/daher/prenatal-panel.members.csv:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    command: ["python", "/opt/daher/seed_prenatal_panel.py"]
    cap_drop: [ALL]
    networks: [internal]

  # ---------------------------------------------------------------------------
  # OpenMRS frontend — nginx serving the O3 single-page application.
  #
  # French is the default locale here AND in the backend's global properties
  # (the latter arrives with the Initializer config in build step 2). Both are
  # needed: this one sets what the SPA opens in, the backend one sets what the
  # data layer considers available.
  # ---------------------------------------------------------------------------
  openmrs-frontend:
    image: openmrs/openmrs-reference-application-3-frontend:3.7.x@sha256:34352f481bf7e72b62406843925479042463fbbd7c8c3f7f5b9cda20b8390117
    restart: unless-stopped
    depends_on:
      openmrs-backend:
        condition: service_healthy
      openmrs-maternity-config:
        condition: service_completed_successfully
      openmrs-prenatal-panel:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_DEFAULT_LOCALE: ${OMRS_DEFAULT_LOCALE:-fr}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      internal:
        # See the note on openmrs-backend: the gateway proxies /openmrs/spa/ to
        # `http://frontend`, hard-coded.
        aliases: [frontend]

  # ---------------------------------------------------------------------------
  # OpenMRS gateway — nginx, joins the SPA and the API on one origin.
  #
  # Kept (rather than folded into Caddy) because O3's frontend assumes the API
  # lives at /openmrs on its own origin, and this is upstream's tested routing.
  # At build step 8, Caddy terminates TLS and proxies to this — it does not
  # replace it. Cost: one container. Benefit: we are not hand-maintaining O3's
  # internal routing across upgrades.
  #
  # The published port is for build-step verification before TLS exists. It
  # binds to loopback only, and it goes away when Caddy lands in step 8.
  # ---------------------------------------------------------------------------
  openmrs-gateway:
    image: openmrs/openmrs-reference-application-3-gateway:3.7.x@sha256:e0f59c5e361bb092d0f5b36b32a1ac314aaabdd95db9047c8ca3309d0f2d7eb3
    restart: unless-stopped
    depends_on:
      - openmrs-frontend
      - openmrs-backend
    environment:
      <<: *common-env
    ports:
      - "127.0.0.1:${OMRS_LOCAL_PORT:-8080}:80"
    networks: [internal]

  # ===========================================================================
  # BUILD STEP 3 — PostgreSQL + OpenELIS (DH-005)
  #
  # Upstream ships six services; we run five and drop one.
  #
  # DROPPED: `proxy` (nginx, :80/:443). Caddy terminates TLS for the whole stack
  #   at DH-016, so a second public-facing reverse proxy is redundant.
  #
  # KEPT, CORRECTING docs/ARCHITECTURE.md §2: `certs`. §2 said we drop `certs`
  #   AND `proxy` "because Caddy terminates TLS for us". That is wrong, and it
  #   was verified wrong rather than argued: both the webapp and the FHIR server
  #   define an SSL connector on 8443 in their own server.xml, referencing
  #   ${oe.ssl.keystorepath} / ${hapi.ssl.keystorepath}. Started without the
  #   keystore volume, Tomcat aborts at boot:
  #
  #     SEVERE  Failed to initialize component [Connector["https-openssl-nio-8443"]]
  #     Caused by: java.lang.IllegalArgumentException: Error creating SSLContext
  #
  #   `certs` is not about public TLS — it generates the internal keystore those
  #   connectors need in order to start at all. Dropping it and editing upstream's
  #   server.xml to delete the connector would mean owning someone else's Tomcat
  #   configuration across every upgrade, which is exactly the trade ADR-010
  #   rejected for the O3 gateway. One short-lived container is cheaper.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Internal keystore/truststore generator AND the properties file that carries
  # the matching password. Runs once, writes into shared volumes, exits.
  # `service_completed_successfully` is what the consumers wait on.
  #
  # DH-021 replaced `itechuw/certgen` here. That image generated NOTHING: it
  # shipped pre-built keystores which Docker seeded into the volume on first
  # mount. Three defects followed from it, all confirmed on this deployment:
  #
  #   1. The private key protecting both internal 8443 connectors is inside a
  #      public image, so anyone can download it.
  #   2. Its certificate had ALREADY EXPIRED — notAfter 2026-07-23, found
  #      2026-08-13. Nothing on this path validates expiry, so it kept working
  #      and would have kept working silently until something stricter (Caddy
  #      at DH-016, or the adapter's mTLS client at ADR-005 Q5) refused it.
  #   3. The store passwords were the published `kspass`/`tspass` in effect,
  #      because `.env` left these variables empty and the old `:-` fallbacks
  #      quietly supplied upstream's values.
  #
  # Certificates and properties are generated by ONE job on purpose. OpenELIS
  # reads its keystore password from common.properties, not from CATALINA_OPTS,
  # so a regenerated keystore paired with a stale password is an outage — that
  # is exactly how the first attempt at this ticket took the webapp down.
  #
  # The passwords are REQUIRED (`:?`). Defaulting them was the mechanism of
  # defect 3, so restoring a default here would silently reintroduce it.
  # ---------------------------------------------------------------------------
  openelis-certs:
    image: daher-health/certgen:0.1.0
    build:
      context: ./openelis-config/certs
    restart: "no"
    environment:
      <<: *common-env
      OE_KEYSTORE_PASSWORD: ${OE_KEYSTORE_PASSWORD:?set OE_KEYSTORE_PASSWORD in .env — must not be the published kspass}
      OE_TRUSTSTORE_PASSWORD: ${OE_TRUSTSTORE_PASSWORD:?set OE_TRUSTSTORE_PASSWORD in .env — must not be the published tspass}
      OE_CERT_VALIDITY_DAYS: ${OE_CERT_VALIDITY_DAYS:-825}
      OE_CERT_RENEW_BEFORE_DAYS: ${OE_CERT_RENEW_BEFORE_DAYS:-30}
    volumes:
      - openelis-keystore:/etc/openelis-global
      - openelis-properties:/output
      - openelis-ca:/ca
      - ./openelis-config/properties/common.properties.template:/template/common.properties.template:ro
    networks: [internal]

  # ---------------------------------------------------------------------------
  # PostgreSQL 14.4 — OpenELIS's own image, with `clinlims` baked in, plus the
  # Keycloak and adapter databases as co-tenants (ADR-001).
  #
  # We do not choose this Postgres version; the image does. The schema and
  # reference data are provisioned from /docker-entrypoint-initdb.d, which is
  # why this cannot simply be pointed at a generic empty Postgres.
  #
  # ⚠️ initdb.d runs ONCE, on an empty data directory. Everything this instance
  # must contain has to be present at first boot — see the seed script's header.
  # ---------------------------------------------------------------------------
  openelis-db:
    image: itechuw/openelis-global-2-database:3.2.1.11@sha256:c7750aad1650a1dbc73f97240167bb778e9df23592e41c2c2232d47a4054c14f
    restart: unless-stopped
    environment:
      <<: *common-env
      # The image defaults these to `clinlims` / `superuser` when unset (see its
      # init.sh). Guarded, for the same reason as the OpenMRS admin password in
      # DH-019: a published default credential must never be reachable by
      # forgetting to set a variable.
      DB_PASSWORD: ${OE_DB_PASSWORD:?set OE_DB_PASSWORD in .env}
      DB_SUPERUSER_PASSWORD: ${OE_DB_SUPERUSER_PASSWORD:?set OE_DB_SUPERUSER_PASSWORD in .env}
      # The base postgres entrypoint's own bootstrap variables. Upstream's compose
      # does not show these, but the image needs them: without POSTGRES_PASSWORD
      # it exits with "Database is uninitialized and superuser password is not
      # specified" and crash-loops (observed at DH-005).
      #
      # Three distinct credentials, deliberately not shared:
      #   postgres  — initdb bootstrap superuser, used to run initdb.d
      #   admin     — OpenELIS's own superuser role, from DB_SUPERUSER_PASSWORD
      #   clinlims  — the application role, from DB_PASSWORD
      #
      # POSTGRES_DB must be `clinlims`: the baked dump loads into it, init.sh runs
      # `ALTER DATABASE clinlims OWNER TO clinlims`, and every datasource URL in
      # this stack ends in /clinlims.
      POSTGRES_USER: postgres
      POSTGRES_DB: clinlims
      POSTGRES_PASSWORD: ${OE_POSTGRES_PASSWORD:?set OE_POSTGRES_PASSWORD in .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      ADAPTER_DB_NAME: ${ADAPTER_DB_NAME:-adapter}
      ADAPTER_DB_USER: ${ADAPTER_DB_USER:-adapter}
      ADAPTER_DB_PASSWORD: ${ADAPTER_DB_PASSWORD:?set ADAPTER_DB_PASSWORD in .env}
    volumes:
      - openelis-db-data:/var/lib/postgresql/data
      - ./openelis-config/postgres-init/zz-daher-extra-databases.sh:/docker-entrypoint-initdb.d/zz-daher-extra-databases.sh:ro
      # Shared by the zz- init hook and the existing-volume one-shot below. It
      # is intentionally outside initdb.d so the entrypoint does not execute it
      # independently before the tenant roles/databases exist.
      - ./openelis-config/postgres-init/harden-tenancy.sh:/usr/local/bin/harden-tenancy:ro
    healthcheck:
      # `pg_isready` alone lies during first boot: the upstream entrypoint starts
      # a temporary PostgreSQL server for initdb.d, then stops it before exec'ing
      # the final server. DH-024 observed this probe go green in that window and
      # start the hardening job just as the temporary server disappeared. PID 1
      # is `postgres` only after initialization is genuinely complete.
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = postgres && pg_isready -U clinlims -d clinlims
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      internal:
        # Upstream hard-codes `db.openelis.org` in the webapp's CATALINA_OPTS and
        # the FHIR server's datasource URL. Those are env-overridable, but the O3
        # gateway at DH-002 taught that upstream hostnames also turn up baked into
        # places that are not — so the alias is belt and braces, and costs nothing.
        aliases: [db.openelis.org]

  # Database-level tenant isolation for both fresh and existing volumes
  # (DH-020). This deliberately leaves OpenELIS's schema grants untouched: a
  # role that cannot CONNECT to clinlims cannot exploit its permissive public
  # schema, while upstream migrations retain their expected schema behavior.
  openelis-db-hardening:
    image: postgres:14.4@sha256:9ceb24f8c5f15c053d973a3610866f473690875dc13eb3282b45302189321040
    restart: "no"
    depends_on:
      openelis-db:
        condition: service_healthy
    environment:
      <<: *common-env
      PGHOST: openelis-db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${OE_POSTGRES_PASSWORD:?set OE_POSTGRES_PASSWORD in .env}
      OE_DB_NAME: clinlims
      OE_DB_OWNER: clinlims
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      ADAPTER_DB_NAME: ${ADAPTER_DB_NAME:-adapter}
      ADAPTER_DB_USER: ${ADAPTER_DB_USER:-adapter}
    entrypoint: ["/usr/local/bin/harden-tenancy"]
    read_only: true
    volumes:
      - ./openelis-config/postgres-init/harden-tenancy.sh:/usr/local/bin/harden-tenancy:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [internal]

  # The webapp image ignores its documented DEFAULT_PW environment variable
  # and seeds the published `adminADMIN!` bcrypt hash even on an empty volume.
  # Apply the required configured secret after the webapp's bootstrap and fail
  # closed before the frontend can expose that account.
  openelis-admin-password:
    image: postgres:14.4@sha256:9ceb24f8c5f15c053d973a3610866f473690875dc13eb3282b45302189321040
    restart: "no"
    depends_on:
      openelis-db:
        condition: service_healthy
      openelis-db-hardening:
        condition: service_completed_successfully
      # First startup rewrites the bundled published hash after the database is
      # already ready. Wait for that bootstrap to finish, then rotate it. The
      # frontend below remains gated until this job exits successfully.
      openelis-webapp:
        condition: service_healthy
    environment:
      <<: *common-env
      PGHOST: openelis-db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${OE_POSTGRES_PASSWORD:?set OE_POSTGRES_PASSWORD in .env}
      OE_DB_NAME: clinlims
      OE_ADMIN_PASSWORD: ${OE_ADMIN_PASSWORD:?set OE_ADMIN_PASSWORD in .env}
    entrypoint: ["/bin/sh", "/usr/local/bin/set-admin-password"]
    read_only: true
    volumes:
      - ./openelis-config/postgres-init/set-admin-password.sh:/usr/local/bin/set-admin-password:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [internal]

  # ---------------------------------------------------------------------------
  # OpenELIS webapp (Tomcat). Not publicly routed; Caddy reaches it at DH-016.
  # ---------------------------------------------------------------------------
  openelis-webapp:
    # DH-011D3 (§13, independent review): itechuw/openelis-global-2:3.2.1.11 ships unpatched --
    # the Daher order-correlation patch (BLOCKER-6/ADR-026, Option F) never reached the deployed
    # service graph through the bare `image:` alone. This follows the same local-derived-image
    # pattern as openmrs-backend above: `image:` names the tag `docker compose build` produces,
    # `build:` says how, and Compose uses the already-built local image unless asked to rebuild.
    # See openelis-config/Dockerfile and openelis-config/patches/order-correlation/PROVENANCE.md
    # for the exact upstream commit pinned and every patch applied on top of it.
    image: daher-health/openelis-webapp:3.2.1.11-order-correlation
    build:
      context: ./openelis-config
    restart: unless-stopped
    depends_on:
      openelis-db:
        condition: service_healthy
      openelis-db-hardening:
        condition: service_completed_successfully
      openelis-certs:
        condition: service_completed_successfully
      keycloak-sso-config:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      CATALINA_OPTS: >-
        -Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims
        -Ddatasource.username=clinlims
        -Ddatasource.password=${OE_DB_PASSWORD}
        -Doe.ssl.keystorepath=/etc/openelis-global/keystore
        -Doe.ssl.truststorepath=/etc/openelis-global/truststore
        -Doe.ssl.keystorepassword=${OE_KEYSTORE_PASSWORD:-kspass}
        -Doe.ssl.truststorepassword=${OE_TRUSTSTORE_PASSWORD:-tspass}
        -Ddaher.openelis.site.code=${DAHER_OPENELIS_SITE_CODE:-}
        -Dorg.itech.login.form=true
        -Dorg.itech.login.saml=${SSO_ENABLED:-false}
        -Dorg.itech.login.saml.loginpage=false
        -Dorg.itech.login.saml.registrationId=keycloak
        -Dorg.itech.login.saml.entityId=openelis
        -Dorg.itech.login.saml.metadatalocation=http://keycloak.openelis.org:8080/realms/daher/protocol/saml/descriptor
    volumes:
      - openelis-keystore:/etc/openelis-global
      - openelis-plugins:/var/lib/openelis-global/plugins
      - openelis-logs:/var/lib/openelis-global/logs
      # The webapp reads its Spring configuration from /run/secrets/common.properties,
      # not from environment variables. Without it the WAR deploys and then dies with
      #   java.io.FileNotFoundException: /run/secrets/common.properties
      # while Tomcat itself reports a successful startup — a failure that looks
      # like success in `docker compose ps` (observed at DH-005).
      #
      # DH-021 changed this from a Docker `secrets:` entry to this volume. A file
      # secret must be a host path, and the real SSL passwords must NOT be
      # committed — so openelis-certs renders the file into this volume at deploy
      # time and it is mounted read-only at the same path.
      - openelis-properties:/run/secrets:ro
    healthcheck:
      # ⚠️ This previously asserted only that `/OpenELIS-Global/` returned 302.
      # That is a FALSE GREEN, observed directly on 2026-08-13 during DH-021: when
      # the Spring context failed to start, Tomcat still answered 302 on every
      # path, so the container reported `healthy` while the entire application was
      # down and every page was a redirect loop.
      #
      # A 302 proves Tomcat is listening. It does not prove OpenELIS started. So
      # assert something only a live application context can produce: the login
      # form itself, returning 200 and containing the Spring Security CSRF token.
      # Same lesson as the OpenMRS backend at DH-002 and Keycloak above — check
      # readiness the application must satisfy, not a port that is merely open.
      test:
        - CMD-SHELL
        - >-
          curl -ksSf -o /tmp/hc.html https://localhost:8443/OpenELIS-Global/LoginPage &&
          grep -q '_csrf' /tmp/hc.html
      interval: 10s
      timeout: 10s
      retries: 30
      # The context now has to be genuinely up, not just bound, so first boot
      # needs more room than the old port-level check did.
      start_period: 180s
    networks:
      internal:
        aliases: [oe.openelis.org]

  # ---------------------------------------------------------------------------
  # OpenELIS HAPI FHIR server — the endpoint the adapter actually talks to
  # (docs/ARCHITECTURE.md §2), not the webapp.
  # ---------------------------------------------------------------------------
  openelis-fhir:
    image: itechuw/openelis-global-2-fhir:3.2.1.11@sha256:e58bc63f2248b55670017b7854ca3dd17c69c2977c4b38b98c20068f8f8e2320
    restart: unless-stopped
    depends_on:
      openelis-db:
        condition: service_healthy
      openelis-db-hardening:
        condition: service_completed_successfully
      openelis-certs:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      FHIR_DATASOURCE_URL: jdbc:postgresql://db.openelis.org:5432/clinlims
      FHIR_DATASOURCE_USERNAME: clinlims
      FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD}
      FHIR_SERVER_ADRESS: http://fhir.openelis.org:8080/fhir/
      # Upstream's compose passes these as JAVA_OPTS. Verified at DH-005 that this
      # does NOT work on this image: JAVA_OPTS is present in the container's
      # environment, but `tr '\0' '\n' < /proc/1/cmdline` shows zero hapi.ssl
      # flags on the JVM — the bitnami Tomcat startup replaces JAVA_OPTS before
      # catalina.sh runs. Tomcat then sees the literal string and aborts:
      #   Cannot obtain resource for specified location [${hapi.ssl.keystorepath}]
      # and BOTH connectors stay down, so the FHIR server answers on no port at
      # all while still logging "Server startup in ...". CATALINA_OPTS survives.
      CATALINA_OPTS: >-
        -Dhapi.ssl.keystorepath=/etc/openelis-global/keystore
        -Dhapi.ssl.keystorepassword=${OE_KEYSTORE_PASSWORD:-kspass}
        -Dhapi.ssl.truststorepath=/etc/openelis-global/truststore
        -Dhapi.ssl.truststorepassword=${OE_TRUSTSTORE_PASSWORD:-tspass}
    volumes:
      - openelis-keystore:/etc/openelis-global
    networks:
      internal:
        # NOTE the spelling: upstream's variable is FHIR_SERVER_ADRESS (one 'd').
        # It is their typo, not ours — do not "fix" it, it is the key they read.
        aliases: [fhir.openelis.org]

  # ---------------------------------------------------------------------------
  # OpenELIS React frontend. Upstream publishes no port for it — the dropped
  # `proxy` served it. Caddy takes that job at DH-016.
  # ---------------------------------------------------------------------------
  openelis-frontend:
    image: itechuw/openelis-global-2-frontend:3.2.1.11@sha256:8054581aee1ef5b15e4a1ebc4fa8d96d7c5021ca36e580a7d78d2f2c7c78bb5a
    restart: unless-stopped
    depends_on:
      openelis-webapp:
        condition: service_healthy
      openelis-admin-password:
        condition: service_completed_successfully
    environment:
      <<: *common-env
    networks:
      internal:
        aliases: [frontend.openelis.org]

  # ===========================================================================
  # BUILD STEP 4 — Keycloak provider + fail-closed SSO plumbing (DH-007/DH-008)
  #
  # Its database already exists: created as a co-tenant of OpenELIS's PostgreSQL
  # at DH-005 (ADR-001), because initdb.d only runs once and waiting until now
  # would have meant no database to connect to.
  #
  # DH-008's protocol/client plumbing is present but defaults disabled until
  # BLOCKER-5's native authorization matrix receives human approval.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    restart: unless-stopped
    depends_on:
      openelis-db:
        condition: service_healthy
      openelis-db-hardening:
        condition: service_completed_successfully
    # `start` (not `start-dev`): dev mode disables HTTPS enforcement and uses an
    # in-memory cache, neither of which should be one flag away on a clinical box.
    # Caddy terminates TLS at DH-016, so proxy=edge with http enabled internally.
    command: ["start", "--import-realm", "--optimized=false"]
    environment:
      <<: *common-env
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db.openelis.org:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME_STRICT: "false"
      # Until Caddy lands, the default is reachable by verification clients on
      # the internal Docker network. DH-016 sets the public https://id.* URL.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.openelis.org:8080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Resolved into the committed realm JSON at import time, which is what keeps
      # secrets out of the repository.
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      KEYCLOAK_OPENMRS_CLIENT_SECRET: ${KEYCLOAK_OPENMRS_CLIENT_SECRET:?set in .env}
      KEYCLOAK_ADAPTER_CLIENT_SECRET: ${KEYCLOAK_ADAPTER_CLIENT_SECRET:?set in .env}
      # DH-EX-008: substituted into dhealth-exchange-realm.json at import time,
      # same mechanism as the two daher-realm secrets above. A separate realm,
      # separate client, never the same value as either of them.
      KEYCLOAK_EXCHANGE_API_CLIENT_SECRET: ${KEYCLOAK_EXCHANGE_API_CLIENT_SECRET:?set in .env}
    volumes:
      - ./keycloak/realm-config:/opt/keycloak/data/import:ro
    healthcheck:
      # Readiness, not liveness — the DH-002 lesson applied up front. Keycloak 26
      # serves health on the MANAGEMENT port 9000, not 8080, and the image ships no
      # curl, so this uses bash's /dev/tcp. It asserts the body says UP rather than
      # that a port is open: during realm import the port is open and the server is
      # not ready, which is exactly the false positive that cost a debugging cycle
      # on the OpenMRS backend.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      internal:
        aliases: [keycloak.openelis.org]

  # `--import-realm` correctly refuses to overwrite an existing realm. That is
  # safe persistence behavior, but it also means DH-008's client changes would
  # otherwise apply only to fresh databases. This one-shot reconciles the two
  # application clients in place without deleting clients, roles, or users.
  keycloak-sso-config:
    image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    restart: "no"
    read_only: true
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/daher/reconcile-sso.sh"]
    environment:
      <<: *common-env
      KEYCLOAK_INTERNAL_URL: http://keycloak.openelis.org:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KEYCLOAK_OPENMRS_CLIENT_SECRET: ${KEYCLOAK_OPENMRS_CLIENT_SECRET:?set in .env}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      OPENMRS_PUBLIC_URL: ${OPENMRS_PUBLIC_URL:-https://emr.${BASE_DOMAIN:-localhost}}
      OPENELIS_PUBLIC_URL: ${OPENELIS_PUBLIC_URL:-https://lab.${BASE_DOMAIN:-localhost}}
      # UI-004/ADR-027 — added to the openmrs client's own redirect/web-origin
      # lists only. The openelis client is untouched (see reconcile-sso.sh).
      DAHER_APP_PUBLIC_URL: ${DAHER_APP_PUBLIC_URL:-https://app.${BASE_DOMAIN:-localhost}}
    volumes:
      - ./keycloak/reconcile-sso.sh:/opt/daher/reconcile-sso.sh:ro
      # Mapper fragments must stay outside Keycloak's realm import directory:
      # they are partial client resources, not RealmRepresentation documents.
      - ./keycloak/mappers:/opt/daher/mappers:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    networks: [internal]

  # ===========================================================================
  # ADAPTER SAFETY SKELETON (DH-010)
  #
  # This service currently owns the ledger, dead-letter table, audit volume,
  # retry policy and health endpoints. It does NOT yet move a clinical message;
  # OpenMRS polling and FHIR mapping start at DH-011.
  # ===========================================================================
  adapter:
    image: daher-health/adapter:0.1.0
    build:
      context: ./adapter
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    # DH-EX-008: deliberately NOT `keycloak: condition: service_healthy`. The
    # Exchange OIDC path is lazy — `JWKSKeySource` wraps a `PyJWKClient` that
    # fetches keys on first token validation, not at process start — and the
    # ledger/dead-letter/retry responsibilities this container owns for the
    # OpenMRS/OpenELIS connector track have no dependency on Keycloak at all.
    # A hard dependency here would gate that unrelated work on Exchange
    # infrastructure being healthy, and would stretch every boot by up to
    # Keycloak's own ~7-minute worst-case start_period+retries window even on
    # a deployment that never uses Exchange. Exchange readiness is surfaced
    # instead through `/health/exchange-ready` (see app.py), which is not
    # wired into this container's own healthcheck below for the same reason.
    depends_on:
      openelis-db:
        condition: service_healthy
      openelis-db-hardening:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      ADAPTER_DB_HOST: openelis-db
      ADAPTER_DB_PORT: 5432
      ADAPTER_DB_NAME: ${ADAPTER_DB_NAME:-adapter}
      ADAPTER_DB_USER: ${ADAPTER_DB_USER:-adapter}
      ADAPTER_DB_PASSWORD: ${ADAPTER_DB_PASSWORD:?set ADAPTER_DB_PASSWORD in .env}
      ADAPTER_AUDIT_PATH: /var/lib/daher/audit/audit.jsonl
      ADAPTER_RETRY_MAX_ATTEMPTS: ${ADAPTER_RETRY_MAX_ATTEMPTS:-5}
      ADAPTER_RETRY_MULTIPLIER_SECONDS: ${ADAPTER_RETRY_MULTIPLIER_SECONDS:-1}
      ADAPTER_RETRY_MAX_SECONDS: ${ADAPTER_RETRY_MAX_SECONDS:-30}
      # DH-EX-008: issuer derived from the SAME KEYCLOAK_PUBLIC_URL that
      # becomes Keycloak's own KC_HOSTNAME (see the keycloak service above) —
      # not a second, independently-typed copy of it, so the two variables can
      # never be set to different hosts by mistake. This relies on Keycloak
      # 26's documented hostname:v2 behavior, that KC_HOSTNAME as a full URL
      # fixes the `iss` claim regardless of request path — NOT independently
      # verified against a running Keycloak by this ticket (its pinned image
      # could not be pulled in this ticket's sandbox; see PROJECT_STATE.md's
      # DH-EX-008 entry). Confirm this against a real token before relying on
      # it in a security-sensitive path.
      EXCHANGE_OIDC_ISSUER: ${EXCHANGE_OIDC_ISSUER:-${KEYCLOAK_PUBLIC_URL:-http://keycloak.openelis.org:8080}/realms/dhealth-exchange}
      # Internal Docker network address, deliberately NOT the public issuer
      # above — this container validates tokens from inside the `internal`
      # network and has no reason to make key-fetching a public HTTPS
      # round-trip through Caddy. Must keep serving the SAME realm's keys as
      # EXCHANGE_OIDC_ISSUER; the two are independent knobs only because
      # issuer identity and network reachability are genuinely different
      # concerns, not because either is expected to vary alone in practice.
      EXCHANGE_OIDC_JWKS_URL: ${EXCHANGE_OIDC_JWKS_URL:-http://keycloak.openelis.org:8080/realms/dhealth-exchange/protocol/openid-connect/certs}
      # Fixed by dhealth-exchange-realm.json's own committed
      # exchange-api-audience mapper config, not a value operators choose
      # independently — override only alongside a matching realm-file change.
      EXCHANGE_OIDC_AUDIENCE: ${EXCHANGE_OIDC_AUDIENCE:-dhealth-exchange-api}
    volumes:
      - adapter-audit:/var/lib/daher/audit
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          body=json.load(urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5));
          assert body == {'status': 'up'}
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [internal]

  # ===========================================================================
  # PINNED P0 — nightly backup sidecar (DH-014). A performed restore is DH-015.
  # ---------------------------------------------------------------------------
  backup:
    image: daher-health/backup:0.1.0
    build:
      context: ./backup
    # The scheduler must not enter a restart loop on a workstation whose .env
    # deliberately lacks the still-unapproved off-site destination/key. Start
    # it explicitly with `--profile backup` only after DH-014's production
    # settings exist. A performed restore remains the separate DH-015 gate.
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      openmrs-db:
        condition: service_healthy
      openelis-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      <<: *common-env
      OMRS_DB_HOST: openmrs-db
      OMRS_DB_NAME: ${OMRS_DB_NAME:-openmrs}
      OMRS_DB_ROOT_PASSWORD: ${OMRS_DB_ROOT_PASSWORD}
      OE_DB_HOST: openelis-db
      OE_DB_NAME: ${OE_DB_NAME:-clinlims}
      OE_POSTGRES_PASSWORD: ${OE_POSTGRES_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      ADAPTER_DB_NAME: ${ADAPTER_DB_NAME:-adapter}
      KEYCLOAK_INTERNAL_URL: http://keycloak.openelis.org:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-0}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_REQUIRE_OFFSITE: ${BACKUP_REQUIRE_OFFSITE:-true}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - openmrs-data:/volumes/openmrs-data:ro
      - adapter-audit:/volumes/adapter-audit:ro
      - backup-data:/backup
    networks: [internal]

  # ===========================================================================
  # BUILD STEP 8 — Caddy reverse proxy, TLS, subdomains (DH-016)
  #
  # The ONLY container that publishes host ports. Everything else stays on the
  # internal network, which is what makes "not publicly routed" true rather
  # than aspirational.
  #
  # ⚠️ With BASE_DOMAIN=localhost, Caddy uses its INTERNAL CA. That proves
  # routing, origins and cookies; it does NOT prove public certificate
  # issuance, which needs the facility's real domain and DNS (NEEDS LIBAN #15).
  # ---------------------------------------------------------------------------

  # ===========================================================================
  # Daher clinical UI static build (UI-002/UI-004). Serves nothing on its own —
  # Caddy's app.$BASE_DOMAIN route is what makes it reachable and what adds the
  # /openmrs/* same-origin proxy ADR-027 specifies. This container holds no
  # OpenMRS credential; it is exactly the static output of `npm run build`.
  # ---------------------------------------------------------------------------
  daher-ui:
    image: daher-health/ui:0.1.0
    build:
      context: ./ui
      target: runtime
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: this image's musl libc resolves localhost
      # to ::1 first, and nginx here only binds 0.0.0.0 — verified directly
      # (localhost: connection refused; 127.0.0.1: succeeds).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    # ⚠️ REQUIRED, not a nicety — this is known bug 20 (2026-08-17 → fixed 2026-08-20).
    #
    # This image runs `caddy` directly as PID 1, and Caddy does not reap orphaned children.
    # Every healthcheck is a `docker exec`, whose process is reparented to PID 1 when it
    # exits; with nothing calling wait(), each one leaks a zombie. At one probe per 15s that
    # is ~5,760 leaked PIDs a day. After seven days the container sat at pids.current 37,499
    # against a cgroup pids.max of 37,503 — so no new process could start at all, every
    # healthcheck failed with `procReady not received`, and the container reported UNHEALTHY
    # while its routes were serving perfectly.
    #
    # `init: true` puts docker-init (tini) at PID 1, which reaps. The evidence that this is
    # the right diagnosis rather than a plausible one: cgroup.threads was 17 while
    # pids.current was 37,499, every other container in this stack had threads ==
    # pids.current, and 37,499 matches the ~40,460 healthchecks the container had run.
    init: true
    depends_on:
      openmrs-gateway:
        condition: service_started
      openelis-frontend:
        condition: service_started
      daher-ui:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Needs the exported CA PEM before it can verify the OpenELIS API leg.
      openelis-certs:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - openelis-ca:/etc/caddy/ca:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Assert the proxy actually serves the EMR vhost over TLS, not merely
      # that Caddy is listening — the DH-002 / bug-15 lesson applied up front.
      test:
        - CMD-SHELL
        - wget -q --no-check-certificate --spider https://emr.$${BASE_DOMAIN}/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [internal]


volumes:
  openmrs-db-data:
  openmrs-data:
  # OpenELIS (DH-005)
  openelis-db-data:
  openelis-keystore:   # internal keystore/truststore from openelis-certs (DH-021)
  openelis-properties: # common.properties rendered with real SSL passwords (DH-021)
  openelis-ca:         # OpenELIS public cert in PEM, so Caddy can verify it (DH-016)
  caddy-data:          # ACME account + issued certificates — losing this re-issues
  caddy-config:
  openelis-plugins:
  openelis-logs:
  adapter-audit:
  backup-data:

networks:
  # Nothing in this stack is reachable from outside except through the reverse
  # proxy (step 8). Databases, the FHIR endpoints and the adapter stay internal.
  internal:
    driver: bridge
