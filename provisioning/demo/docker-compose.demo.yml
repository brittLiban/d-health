# DH-027 three-container demonstration (ADR-020, ADR-022, ADR-023).
#
# portal (172.30.0.10) -> api (172.30.0.20) <- agent (172.30.0.30)
# outsider (172.30.0.40) holds a VALID credential but a disallowed address.
#
# Static addressing so the API's source allowlist is demonstrated against real addresses
# rather than asserted. `agent` and `portal` publish nothing and listen on nothing the API
# can reach — that asymmetry is the design.
name: daher-demo

x-common: &common
  build:
    context: ..
    target: test
  working_dir: /app
  # Harness only: the shared volume is root-owned and every side writes to it. The
  # production images run as unprivileged users; this says nothing about deployment.
  user: "0:0"
  volumes:
    - ../demo:/app/demo:ro
    - ../src:/app/src:ro
    - shared:/shared
  environment: &common-env
    PYTHONPATH: /app/src
    DEMO_SHARED: /shared

services:
  api:
    <<: *common
    command: ["python", "/app/demo/api_server.py"]
    environment:
      <<: *common-env
      DEMO_HOST_ID: host-a
      # Only the portal and the agent may reach the API (ADR-023).
      DEMO_ALLOWED_CIDRS: "172.30.0.10/32,172.30.0.30/32"
    networks:
      demo:
        ipv4_address: 172.30.0.20

  portal:
    <<: *common
    command: ["python", "/app/demo/portal_server.py"]
    environment:
      <<: *common-env
      PROVISIONING_URL: https://api:8443
    networks:
      demo:
        ipv4_address: 172.30.0.10
    depends_on: [api]

  agent:
    <<: *common
    command: ["python", "/app/demo/agent_runner.py"]
    # ⚠️ The agent gets a real Docker daemon. That is BY DESIGN and is exactly what ADR-022
    # accounts for: the agent runs on the facility host and needs to bring its stack up.
    # Docker access is root access, which is precisely why the API never has it and why the
    # compose file lives here rather than arriving in a job.
    volumes:
      - ../demo:/app/demo:ro
      - ../src:/app/src:ro
      - shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
      - ./facility-stack:/opt/daher:ro
      - facilities:/facilities
    environment:
      <<: *common-env
      HOST_ID: host-a
      PROVISIONING_URL: https://api:8443
      AGENT_CA_BUNDLE: /shared/tls/real-ca.pem
      FACILITY_COMPOSE: /opt/daher/docker-compose.yml
      FACILITY_ROOT: /facilities
      BASE_DOMAIN: demo.local
    networks:
      demo:
        ipv4_address: 172.30.0.30
    depends_on: [api]

  outsider:
    <<: *common
    command: ["sleep", "3600"]
    networks:
      demo:
        ipv4_address: 172.30.0.40
    depends_on: [api]

volumes:
  shared:
  facilities:

networks:
  demo:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
