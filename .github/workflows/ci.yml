              if "daherAnalysisCorrelationService" not in ft_added or "getByAnalysisId" not in ft_added:
                  bad.append("FhirTransformServiceImpl.java.patch: does not look up the added-test "
                              "namespace (daherAnalysisCorrelationService.getByAnalysisId) before "
                              "falling back to the initial-order clinicalOrderId identifier")
              if "addedTestCorrelations.size() == 1" not in ft_added:
                  bad.append("FhirTransformServiceImpl.java.patch: an Analysis with no added-test "
                              "correlation must still fall through to the pre-existing "
                              "clinicalOrderId-based initial-order behavior, not lose it")

              # DH-011P3 §4: analysis_id is now unique at the DB, so this must never legitimately
              # find more than one row -- but the transform must not normalize corruption if it
              # somehow does. Must fail closed, never emit multiple source-event identifiers for
