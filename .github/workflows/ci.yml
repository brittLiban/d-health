      - name: ADR-017E2 — Provider identity is role-derived, fail-closed, and a single mechanism
        # ADR-017E found no supported Keycloak protocol mapper can emit a
        # deterministic, fail-closed "provider" claim conditional on client-role
        # membership: oauth2login defaults a genuinely absent claim to
        # activated (fail-open), and every mapper-based candidate tried either
        # produced a non-deterministic value or lost to a competing mapper
        # under undefined precedence. ADR-017E2's fix instead patches
        # oauth2login itself (openmrs-config/patches/oauth2login-bridge/
        # OAuth2LoginController.java.patch) to derive Provider activation from
        # the same "roles" claim OpenMRS role assignment already consumes —
        # exact "Provider" client-role membership, nothing else — and removes
        # the now-superseded unconditional provider claim mapper everywhere.
        # This guard cannot boot the real stack (see this file's header); it
        # asserts on committed config and patch source. See PROJECT_STATE.md's
        # ADR-017E2 entry for the runtime proof.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          bad = []

          patch_path = Path("openmrs-config/patches/oauth2login-bridge/OAuth2LoginController.java.patch")
          if not patch_path.exists():
              bad.append("OAuth2LoginController.java.patch is missing")
              patch_text = ""
          else:
              patch_text = patch_path.read_text()

              # The role-derived decision method must exist and be wired into login().
              if "isProviderRoleGranted" not in patch_text:
                  bad.append("OAuth2LoginController.java.patch: isProviderRoleGranted is missing")
              if "if (isProviderRoleGranted(userInfo))" not in patch_text:
                  bad.append("OAuth2LoginController.java.patch: login() does not call isProviderRoleGranted")

              # Upstream's own fail-open check must be removed (a "-" diff line),
              # not reintroduced on an added ("+") line — the patch file's "-"
              # lines legitimately still show the old code being deleted.
              added_lines = [l for l in patch_text.splitlines() if l.startswith("+")]
              if any('userInfo.getString(UserInfo.PROP_PROVIDER, "true")' in l for l in added_lines):
                  bad.append("OAuth2LoginController.java.patch: still reads the legacy fail-open provider claim")

              # Exact membership only — the constant must be the literal role name,
              # checked via List.contains (exact equals), never a case-folded or
              # substring-style comparison.
              if 'DAHER_PROVIDER_ROLE_NAME = "Provider"' not in patch_text:
                  bad.append('OAuth2LoginController.java.patch: DAHER_PROVIDER_ROLE_NAME must be exactly "Provider"')
              if "roleNames.contains(DAHER_PROVIDER_ROLE_NAME)" not in patch_text:
                  bad.append("OAuth2LoginController.java.patch: role check must be exact List.contains membership")
              for bad_pattern in (".toLowerCase()", ".indexOf(", ".startsWith(", ".matches(", "Reception"):
                  if bad_pattern in patch_text:
                      bad.append(f"OAuth2LoginController.java.patch: unexpected pattern {bad_pattern!r} near the role check")

              # Fails closed, not open, on a missing/null/malformed claim.
              if "catch (RuntimeException e)" not in patch_text or "return false;" not in patch_text:
                  bad.append("OAuth2LoginController.java.patch: does not fail closed on a missing/malformed roles claim")

          dockerfile = Path("openmrs-config/Dockerfile").read_text()
          if "OAuth2LoginController.java.patch" not in dockerfile:
              bad.append("Dockerfile: does not apply OAuth2LoginController.java.patch")
          if "git -C /src apply /patch/OAuth2LoginController.java.patch" not in dockerfile:
              bad.append("Dockerfile: does not git apply OAuth2LoginController.java.patch")

          # Exactly one provider-claim mechanism must exist overall: the patched
          # Java logic above. No Keycloak mapper anywhere may still emit a
          # "provider" claim — hardcoded true, hardcoded false, or otherwise —
          # since that would be a second, competing, precedence-undefined
          # mechanism (ADR-017E's own finding).
          for path in Path("keycloak").rglob("*.json"):
              text = path.read_text()
              if "provider" in text.lower():
                  bad.append(f"{path}: must not reference a provider claim — the Java patch is the sole mechanism now")

          stale_mapper = Path("keycloak/mappers/openmrs-provider-disabled-mapper.json")
          if stale_mapper.exists():
              bad.append(f"{stale_mapper} must be removed — superseded by the role-derived patch")

          reconcile = Path("keycloak/reconcile-sso.sh").read_text()
          if 'reconcile_mapper "$openmrs_id" "provider disabled until approved"' in reconcile:
              bad.append("reconcile-sso.sh: still reconciles (recreates) the superseded provider-disabled mapper")
          if 'remove_mapper_if_present "$openmrs_id" "provider disabled until approved"' not in reconcile:
              bad.append("reconcile-sso.sh: does not remove the superseded provider-disabled mapper on existing realms")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — Provider identity is role-derived, fails closed, and exactly one mechanism exists")
          PY

      - name: Bug #23 — OpenMRS client-role mapper never leaks another client's roles
        # Known Bug #23: `keycloak/mappers/openmrs-client-roles-mapper.json`
        # (oidc-usermodel-client-role-mapper, claim "roles") shipped with no
        # usermodel.clientRoleMapping.clientId, which is Keycloak's all-clients
        # form — it relays every client role the user holds on ANY client, not
        # just openmrs. Measured live: a synthetic user holding only a foreign
        # client's role named exactly "Provider" (no openmrs "Provider" grant)
        # produced a roles claim containing "Provider", indistinguishable from
        # a genuine grant by ADR-017E2's exact-string check — a real
        # cross-client privilege-escalation path, not inert noise (a realm's
        # own default-roles-daher composite already leaked account-client
        # roles the same way, confirmed both pre- and post-fix). The fix scopes
        # the mapper to the openmrs client only, in both the fresh-realm import
        # (daher-realm.json) and the existing-realm reconciliation fragment
        # (keycloak/mappers/openmrs-client-roles-mapper.json) — Keycloak-native,
        # no oauth2login/Java change, ADR-017E2's exact-match logic untouched.
        # This cannot boot the real stack (see this file's header); it asserts
        # on committed config. See PROJECT_STATE.md/DECISIONS.md's Bug #23 entry
        # for the live disposable-Keycloak token proof (both paths, all
        # negative/mixed/composite/realm-role controls).
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          bad = []

          external_path = Path("keycloak/mappers/openmrs-client-roles-mapper.json")
          realm_path = Path("keycloak/realm-config/daher-realm.json")

          external = json.loads(external_path.read_text())
          realm = json.loads(realm_path.read_text())

          openmrs_clients = [c for c in realm["clients"] if c["clientId"] == "openmrs"]
          if len(openmrs_clients) != 1:
              bad.append(f"daher-realm.json: expected exactly one openmrs client, found {len(openmrs_clients)}")
              inline = None
          else:
              role_mappers = [m for m in openmrs_clients[0]["protocolMappers"] if m.get("name") == "client roles"]
              if len(role_mappers) != 1:
                  bad.append(f"daher-realm.json: expected exactly one 'client roles' mapper on openmrs, found {len(role_mappers)}")
                  inline = None
              else:
                  inline = role_mappers[0]

          # The two files are the only reason fresh-realm import and
          # existing-realm reconciliation stay in agreement — reconcile-sso.sh
          # applies the external file via reconcile_mapper, the realm JSON
          # applies the inline copy on --import-realm. Drift between them is
          # exactly how this class of bug survives a partial fix.
          if inline is not None and inline != external:
              bad.append(
                  "the inline 'client roles' mapper in daher-realm.json and "
                  "keycloak/mappers/openmrs-client-roles-mapper.json have drifted "
                  "apart — both must stay byte-identical"
              )

          for label, mapper in (("external mapper file", external), ("inline realm mapper", inline)):
              if mapper is None:
                  continue
              if mapper.get("protocolMapper") != "oidc-usermodel-client-role-mapper":
                  bad.append(f"{label}: protocolMapper must stay oidc-usermodel-client-role-mapper")
              config = mapper.get("config", {})
              if config.get("usermodel.clientRoleMapping.clientId") != "openmrs":
                  bad.append(
                      f"{label}: usermodel.clientRoleMapping.clientId must be exactly \"openmrs\" — "
                      "absent or any other value is Keycloak's all-clients form (Bug #23)"
                  )
              if config.get("claim.name") != "roles":
                  bad.append(f"{label}: claim.name must stay \"roles\" — oauth2login.mapping.user.roles reads this exact claim")
              if config.get("multivalued") != "true":
                  bad.append(f"{label}: multivalued must stay \"true\"")

          # Scoping this one mapper is worthless if a second mapper on the same
          # client also emits the "roles" claim — ADR-017E found exactly this
          # "two competing mappers, undefined precedence" failure mode once
          # already. Exactly one mapper may emit this claim.
          if openmrs_clients:
              roles_claim_mappers = [
                  m for m in openmrs_clients[0]["protocolMappers"]
                  if (m.get("config") or {}).get("claim.name") == "roles"
              ]
              if len(roles_claim_mappers) != 1:
                  bad.append(
                      "daher-realm.json: exactly one mapper on the openmrs client may emit the "
                      f'"roles" claim, found {len(roles_claim_mappers)}: '
                      f"{[m.get('name') for m in roles_claim_mappers]}"
                  )

          # The external file being correct proves nothing for an already-existing
          # realm unless reconcile-sso.sh still applies it there.
          reconcile = Path("keycloak/reconcile-sso.sh").read_text()
          if 'reconcile_mapper "$openmrs_id" "client roles"' not in reconcile:
              bad.append(
                  "reconcile-sso.sh: no longer reconciles the openmrs 'client roles' mapper — "
                  "existing realms would never receive the Bug #23 scoping fix"
              )

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — the OpenMRS client-role mapper is scoped to the openmrs client only, in both provisioning paths")
          PY

      - name: Bug #25 — first-login authentication uses daemon create result
        # OpenMRS's ContextDAO.createUser contract returns the User committed by
        # its daemon thread/session. oauth2login 1.5.0 discarded it and reread
        # through the caller's old REPEATABLE_READ snapshot, producing a null
        # authenticated User on the first response. This static companion to
        # FirstLoginAuthenticationTest guards the exact production patch wiring
        # and refuses retry/sleep/cache-flush workarounds.
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          bad = []
          patch_path = Path("openmrs-config/patches/oauth2login-bridge/OAuth2UserInfoAuthenticationScheme.java.patch")
          patch_text = patch_path.read_text() if patch_path.exists() else ""
          if not patch_text:
              bad.append("OAuth2UserInfoAuthenticationScheme.java.patch is missing")
          else:
              added = [line[1:] for line in patch_text.splitlines() if line.startswith("+") and not line.startswith("+++")]
              added_text = "\n".join(added)
              if "user = createUser(creds.getUserInfo());" not in added_text:
                  bad.append("authentication does not use createUser's returned User")
              if "private User createUser(UserInfo userInfo)" not in added_text:
                  bad.append("createUser wrapper does not return User")
              if "return getContextDAO().createUser(user, password, userInfo.getRoleNames());" not in added_text:
                  bad.append("createUser wrapper does not return ContextDAO.createUser's authoritative result")
              forbidden = ("Thread.sleep", "sleep(", "retry", "clearEntireCache", "flushSession", "refreshEntity")
              for pattern in forbidden:
                  if pattern in added_text:
                      bad.append(f"first-login patch contains forbidden workaround {pattern!r}")

          dockerfile = Path("openmrs-config/Dockerfile").read_text()
          if "COPY patches/oauth2login-bridge/OAuth2UserInfoAuthenticationScheme.java.patch" not in dockerfile:
              bad.append("Dockerfile does not copy the first-login patch")
          if "git -C /src apply /patch/OAuth2UserInfoAuthenticationScheme.java.patch" not in dockerfile:
              bad.append("Dockerfile does not apply the first-login patch")

          if bad:
              print("\n".join(f"::error::{item}" for item in bad)); sys.exit(1)
          print("ok — first-login auth uses the committed daemon result with no visibility workaround")
          PY

      - name: ADR-028 — Daher Maternity Admission is a single, additive, Daher-owned Visit type
        # UI-013's own pre-write gate found no approved OpenMRS Visit type for a
        # Daher maternity admission (BLOCKER-7 / NEEDS LIBAN #20) — Facility
        # Visit had only ever been an inherited authorization-test fixture
        # (ADR-017C/D/E2), never an approval. ADR-028's decision: a dedicated
        # Daher-owned Visit type, provisioned through Initializer 2.12.0's own
        # native "visittypes" CSV domain (confirmed by disassembling the pinned
        # module's own class files, not assumed) — the same mechanism and CSV
        # shape already backing locations-daher.csv/roles-daher.csv. This guard
        # cannot boot the real stack (see this file's header); it asserts on
        # the committed CSV and compose mount. See PROJECT_STATE.md's BLOCKER-7
        # entry for the fresh-database / existing-database / second-pass proof.
        run: |
          python - <<'PY'
          import csv, sys
          from pathlib import Path

          bad = []

          DAHER_VISIT_TYPE_NAME = "Daher Maternity Admission"
          DAHER_VISIT_TYPE_UUID = "194bf546-68d7-42c0-8371-5b0f2b1cf5f3"
          UPSTREAM_VISIT_TYPES = {"Facility Visit", "Home Visit", "OPD Visit", "Offline Visit", "Group Session"}

          csv_path = Path("openmrs-config/initializer/visittypes/visittypes-daher.csv")
          if not csv_path.exists():
              bad.append("openmrs-config/initializer/visittypes/visittypes-daher.csv is missing")
          else:
              with csv_path.open(newline="", encoding="utf-8") as fh:
                  rows = list(csv.DictReader(fh))

              # Exactly one Daher-owned row — this ticket's own requirement,
              # "one Daher-owned Visit type only."
              if len(rows) != 1:
                  bad.append(f"visittypes-daher.csv: expected exactly one row, found {len(rows)}")
              else:
                  row = rows[0]
                  if row.get("Name") != DAHER_VISIT_TYPE_NAME:
                      bad.append(f"visittypes-daher.csv: Name must be exactly {DAHER_VISIT_TYPE_NAME!r}, found {row.get('Name')!r}")
                  if row.get("Uuid") != DAHER_VISIT_TYPE_UUID:
                      bad.append(f"visittypes-daher.csv: Uuid must stay pinned to {DAHER_VISIT_TYPE_UUID!r} — changing it orphans any Visit already created with it")
                  # Additive only — this row must never itself void/retire anything.
                  if row.get("Void/Retire", "").strip():
                      bad.append("visittypes-daher.csv: the Daher Maternity Admission row must not be voided/retired")
                  if row.get("Name") in UPSTREAM_VISIT_TYPES:
                      bad.append("visittypes-daher.csv must not reuse an upstream Visit type name")

              # No second file in the same domain silently defines (or voids) an
              # upstream Visit type — the CSV domain is additive-only by design.
              for other in Path("openmrs-config/initializer/visittypes").glob("*.csv"):
                  if other == csv_path:
                      continue
                  bad.append(f"{other}: unexpected extra file in the visittypes domain — only visittypes-daher.csv is provisioned")

          # The mount that actually delivers visittypes-daher.csv to OpenMRS at
          # boot exists, using Initializer's own domain folder name for
          # VISIT_TYPES ("visittypes" — bytecode-confirmed, ADR-028) — a CSV
          # nobody mounts is written, not provisioned.
          compose = Path("docker-compose.yml").read_text()
          if "openmrs-config/initializer/visittypes:/openmrs/distribution/openmrs_config/visittypes/zz-daher-health:ro" not in compose:
              bad.append("docker-compose.yml: the visittypes Initializer directory is not mounted into the openmrs-backend service")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — Daher Maternity Admission is a single, additive, Daher-owned Visit type")
          PY

      - name: ADR-029 — Admission Encounter type is reproducible, upstream semantics preserved
        # UI-013's live closure pass found a genuinely fresh database has zero
        # Encounter types beyond the core "Attachment Upload" — "Admission" (the
        # type UI-013's Encounter POST requires) only exists on today's stacks
        # because a bulk upstream reference-content import fired once,
        # historically (BLOCKER-8). ADR-029's decision: pin that EXACT existing
        # upstream semantic (same name, same UUID) as reproducible Daher config
        # via Initializer 2.12.0's native "encountertypes" CSV domain (bytecode-
        # confirmed — a different shape from "visittypes": EncounterTypeLineProcessor
        # additionally supports optional "view privilege"/"edit privilege"
        # columns, deliberately left blank here to match the existing row's own
        # NULL/NULL state) — not a new "Daher Admission" concept. This guard
        # cannot boot the real stack (see this file's header); it asserts on the
        # committed CSV and compose mount. See PROJECT_STATE.md's BLOCKER-8 entry
        # for the fresh-database / existing-database / second-pass proof.
        run: |
          python - <<'PY'
          import csv, sys
          from pathlib import Path

          bad = []

          ADMISSION_NAME = "Admission"
          ADMISSION_UUID = "e22e39fd-7db2-45e7-80f1-60fa0d5a4378"

          csv_path = Path("openmrs-config/initializer/encountertypes/encountertypes-daher.csv")
          if not csv_path.exists():
              bad.append("openmrs-config/initializer/encountertypes/encountertypes-daher.csv is missing")
          else:
              with csv_path.open(newline="", encoding="utf-8") as fh:
                  rows = list(csv.DictReader(fh))

              # Exactly one committed row — reproducing the one existing
              # semantic, not introducing a second Daher-owned Encounter type.
              if len(rows) != 1:
                  bad.append(f"encountertypes-daher.csv: expected exactly one row, found {len(rows)}")
              else:
                  row = rows[0]
                  if row.get("Name") != ADMISSION_NAME:
                      bad.append(f"encountertypes-daher.csv: Name must be exactly {ADMISSION_NAME!r}, found {row.get('Name')!r}")
                  if row.get("Uuid") != ADMISSION_UUID:
                      bad.append(f"encountertypes-daher.csv: Uuid must stay pinned to {ADMISSION_UUID!r} — this is the existing upstream semantic, not a new one")
                  if row.get("Void/Retire", "").strip():
                      bad.append("encountertypes-daher.csv: the Admission row must not be voided/retired")
                  # No new clinical semantics: this ticket pins the EXISTING
                  # meaning only, so it must not carry a privilege scope the
                  # existing row never had (both are NULL upstream — ADR-029).
                  if row.get("View privilege", "").strip() or row.get("Edit privilege", "").strip():
                      bad.append("encountertypes-daher.csv: must not set View/Edit privilege — the existing Admission row has neither")

              # No second file in the same domain, and no name colliding with
              # "Daher Admission" or similar — this is reproducibility of the
              # existing semantic, never a second/renamed admission concept.
              for other in Path("openmrs-config/initializer/encountertypes").glob("*.csv"):
                  if other == csv_path:
                      continue
                  bad.append(f"{other}: unexpected extra file in the encountertypes domain — only encountertypes-daher.csv is provisioned")
              if csv_path.exists():
                  names = [r.get("Name", "") for r in rows]
                  if any(n != ADMISSION_NAME and "admission" in n.lower() for n in names):
                      bad.append("encountertypes-daher.csv: must not introduce a second admission-named Encounter type (e.g. 'Daher Admission')")

          # The mount that actually delivers encountertypes-daher.csv to
          # OpenMRS at boot exists, using Initializer's own domain folder name
          # for ENCOUNTER_TYPES ("encountertypes" — bytecode-confirmed, ADR-029).
          compose = Path("docker-compose.yml").read_text()
          if "openmrs-config/initializer/encountertypes:/openmrs/distribution/openmrs_config/encountertypes/zz-daher-health:ro" not in compose:
              bad.append("docker-compose.yml: the encountertypes Initializer directory is not mounted into the openmrs-backend service")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — Admission Encounter type is reproducible, upstream semantics preserved")
          PY

      - name: DH-011D order-correlation patch content guards
        # This job cannot boot the real OpenELIS stack (see this file's header), so it asserts
        # on committed patch/config source, mirroring the oauth2login guards above. Runtime
        # proof (build success, live search 400->200, DB-level concurrency) is recorded in
        # PROJECT_STATE.md and openelis-config/patches/order-correlation/PROVENANCE.md.
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          bad = []
          base = Path("openelis-config/patches/order-correlation")

          # --- pinned upstream commit/tag, asserted in the Dockerfile itself ---
          dockerfile = Path("openelis-config/Dockerfile").read_text()
          if "--branch 3.2.1.11" not in dockerfile:
              bad.append("Dockerfile: does not clone the pinned 3.2.1.11 tag")
          if "e2a6bdf7999fa3754e7cdafbd2a91259c3f0ce23" not in dockerfile:
              bad.append("Dockerfile: does not assert the exact pinned commit")
          for patch_name in (
              "ServiceRequestProvider.java.patch",
              "ServiceRequestProviderCancel.java.patch",
              "FhirTransformServiceImpl.java.patch",
              "LiquibaseConfig.java.patch",
              "base-changelog.xml.patch",
              "ElectronicOrder.hbm.xml.patch",
              "SampleEditService.java.patch",
              "SampleEditServiceImpl.java.patch",
              "SampleEditRestController.java.patch",
              "persistence.xml.patch",
          ):
              if f"git -C /build apply /patch/{patch_name}" not in dockerfile:
                  bad.append(f"Dockerfile: does not git apply {patch_name}")
          # DH-011P2 §18: every .patch file this directory ships must actually be consumed by
          # the Dockerfile -- catches a patch being added here and silently never applied,
          # not just the reverse (a patch the Dockerfile expects but the directory lacks).
          for patch_file in sorted(base.glob("*.patch")):
              if f"git -C /build apply /patch/{patch_file.name}" not in dockerfile:
                  bad.append(f"Dockerfile: {patch_file.name} exists in the patch directory but is "
                              "never applied -- every shipped patch must be consumed")
          for required_copy in (
              "DaherOrderCorrelation.java",
              "001-electronic-order-daher-correlation-unique.xml",
              "DaherAnalysisCorrelation.java",
              "DaherAddedTestTransaction.java",
              "DaherCancellationTransaction.java",
              "004-daher-analysis-correlation.xml",
              "005-daher-analysis-correlation-unique-analysis.xml",
              "DaherPatientIdentity.java",
              "DaherPatientIdentityDAO.java",
              "DaherPatientIdentityDAOImpl.java",
              "DaherPatientIdentityService.java",
              "DaherPatientIdentityServiceImpl.java",
              "DaherPatientIdentityTransaction.java",
              "006-daher-patient-identity.xml",
          ):
              if required_copy not in dockerfile:
                  bad.append(f"Dockerfile: does not copy {required_copy} into the build context")

          # --- ServiceRequestProvider.java.patch: search parameter + inbound read + selection rules ---
          sr_patch_path = base / "ServiceRequestProvider.java.patch"
          if not sr_patch_path.exists():
              bad.append("ServiceRequestProvider.java.patch is missing")
              sr_patch = ""
          else:
              sr_patch = sr_patch_path.read_text()
              added = [l for l in sr_patch.splitlines() if l.startswith("+")]
              added_text = "\n".join(added)

              if "@OptionalParam(name = ServiceRequest.SP_IDENTIFIER)" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: SP_IDENTIFIER search parameter is missing")
              if "extractDaherOrderIdentifier" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: extractDaherOrderIdentifier is missing")
              if "final String daherOrderId = extractDaherOrderIdentifier(serviceRequest);" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: createServiceRequest does not call extraction")
              if "persistDaherOrderCorrelation" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: persistDaherOrderCorrelation is missing")
              if "sample.setClinicalOrderId(electronicOrderId)" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: does not link the sample via clinicalOrderId")
              if "electronicOrder.setType(ElectronicOrderType.FHIR)" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: created order is not explicitly typed FHIR")

              # Exact-one-match selection rules -- zero and multiple must both be rejected.
              if 'if (matches.isEmpty())' not in added_text or "found none" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: zero-match rejection is missing")
              if "matches.size() > 1" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: multiple-match rejection is missing")

              if "DaherOrderCorrelation.SYSTEM.equals(identifier.getSystem())" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: identifier selection is not an exact system match")

              # Never the accession number, specimen id, patient id, or requester id as the
              # correlation source -- checked specifically within extractDaherOrderIdentifier's
              # own body, not the whole file (those tokens legitimately appear elsewhere, e.g.
              # persistDaherOrderCorrelation's unrelated sample-linking code).
              extract_start = added_text.find("private String extractDaherOrderIdentifier")
              extract_end = added_text.find("private void persistDaherOrderCorrelation")
              if extract_start == -1 or extract_end == -1 or extract_end <= extract_start:
                  bad.append("ServiceRequestProvider.java.patch: could not isolate extractDaherOrderIdentifier's body")
              else:
                  extract_body = added_text[extract_start:extract_end]
                  for token in ("getAccessionNumber()", "SP_SPECIMEN", "getSubject()", "getRequester()"):
                      if token in extract_body:
                          bad.append(f"ServiceRequestProvider.java.patch: extractDaherOrderIdentifier "
                                     f"references {token!r} -- correlation must come only from "
                                     f"the Daher-system identifier, never accession/specimen/subject/requester")

              # No fuzzy comparison anywhere in the new logic.
              for bad_pattern in (".toLowerCase()", ".toUpperCase()", ".contains(", ".startsWith(", ".indexOf("):
                  if bad_pattern in added_text:
                      bad.append(f"ServiceRequestProvider.java.patch: unexpected fuzzy-comparison pattern {bad_pattern!r}")

              # Deliberately does NOT set sample.referringId (would collide with the existing
              # basedOn/intent logic) -- see PROVENANCE.md and the javadoc in the patch itself.
              if "sample.setReferringId(daherOrderId)" in added_text:
                  bad.append("ServiceRequestProvider.java.patch: must not set sample.referringId "
                              "(collides with existing basedOn/intent logic keyed off it)")

          # --- FhirTransformServiceImpl.java.patch: outbound echo, keyed off clinicalOrderId only ---
          ft_patch_path = base / "FhirTransformServiceImpl.java.patch"
          if not ft_patch_path.exists():
              bad.append("FhirTransformServiceImpl.java.patch is missing")
              ft_patch = ""
          else:
              ft_patch = ft_patch_path.read_text()
              ft_added = "\n".join(l for l in ft_patch.splitlines() if l.startswith("+"))
              if "DaherOrderCorrelation.SYSTEM" not in ft_added:
                  bad.append("FhirTransformServiceImpl.java.patch: does not echo DaherOrderCorrelation.SYSTEM")
              if "sample.getClinicalOrderId()" not in ft_added:
                  bad.append("FhirTransformServiceImpl.java.patch: outbound echo must key off clinicalOrderId")
              if "sample.getReferringId()" in ft_added:
                  bad.append("FhirTransformServiceImpl.java.patch: outbound echo must not read referringId")
              if "ElectronicOrderType.FHIR.equals(linkedOrder.getType())" not in ft_added:
                  bad.append("FhirTransformServiceImpl.java.patch: does not verify the linked order is FHIR-typed")

              # DH-011P2 §5: an added-test Analysis must echo its OWN correlation, not the
