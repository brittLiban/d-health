# Daher Health CI (DH-027M)
#
# Why this exists: the repository had 500+ tests across four suites — adapter 94,
# provisioning 453, seed 16, form-safety 19 — and nothing enforcing any of them.
# Every verification recorded in PROJECT_STATE.md was performed by hand, which
# means it was exactly as reliable as whoever remembered to run it.
#
# Every step below was executed locally before being committed, and each guard was
# control-tested by breaking it on a throwaway copy of the tree: an unpinned
# `:latest` is caught, a broken relative link is caught, a corrupt tracked JSON is
# caught, and a suite discovering zero tests is refused rather than passing.
#
# What is deliberately NOT here: the ~50-minute clinical cold boot. Running that
# on every push would make CI useless within a week, and a check people learn to
# ignore is worse than no check. Full-stack verification stays a documented manual
# procedure (README "Verifying the whole stack") plus DH-027J's fresh-VM
# demonstration.
#
# Everything below runs in well under a couple of minutes and gates only things
# that are genuinely fast to assert.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.13 matches the pinned python:3.13.14-slim-bookworm base the adapter and
  # provisioning images are built from, and the py313 target in both pyproject
  # files. Keep these in step; a CI that lints against a different version than
  # it ships is testing the wrong thing.
  PYTHON_VERSION: "3.13"

jobs:
  adapter:
    name: adapter — ruff + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adapter
          POSTGRES_PASSWORD: adapter
          POSTGRES_DB: adapter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adapter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: adapter/requirements-dev.txt
      - run: pip install -r adapter/requirements-dev.txt
      - name: Dependency consistency
        run: pip check
      - name: Ruff lint
        run: ruff check src tests migrations
        working-directory: adapter
      - name: Ruff format
        run: ruff format --check src tests migrations
        working-directory: adapter
      - name: pytest
        # PYTHONPATH mirrors the image's ENV PYTHONPATH=/app/src.
        run: PYTHONPATH=src python -m pytest -q
        working-directory: adapter
      - name: Migration history reaches head on a fresh database
        # DAHER (adapter live-recovery ticket): a stale runtime image bound to an
        # older container silently regressed to a database revision Alembic's own
        # history no longer recognised ("Can't locate revision identified by
        # '0002_watermarks'") -- reproduced live in production. Filename-scanning
        # alone would not have caught it (the file was always present in source);
        # what actually failed was applying the real migration chain against a
        # real database from a real build.
        #
        # Comparing `alembic current` against `alembic heads` alone is NOT
        # sufficient and was control-tested to prove that: with 0002_watermarks.py
        # deleted, a fresh database upgrades cleanly to 0001_safety_ledger, and
        # "heads" -- computed from that same reduced file set -- also reports
        # 0001_safety_ledger, so current == heads holds despite the migration
        # being silently lost. EXPECTED_HEAD is therefore a literal, hand-updated
        # constant naming the specific revision this repository's history is
        # currently known to require -- bump it deliberately whenever a new
        # migration is added, the same way the seed/form-safety count floors
        # elsewhere in this file are maintained by hand.
        env:
          ADAPTER_DB_HOST: localhost
          ADAPTER_DB_PORT: 5432
          ADAPTER_DB_USER: adapter
          ADAPTER_DB_PASSWORD: adapter
          ADAPTER_DB_NAME: adapter
          EXPECTED_HEAD: 0002_watermarks
        working-directory: adapter
        run: |
          alembic upgrade head
          current=$(alembic current | awk '{print $1}')
          heads=$(alembic heads | awk '{print $1}')
          echo "alembic current: ${current}"
          echo "alembic heads:   ${heads}"
          echo "expected head:   ${EXPECTED_HEAD}"
          test -n "$current" || { echo "::error::alembic current produced no revision"; exit 1; }
          test "$current" = "$heads" || { echo "::error::current ($current) does not match heads ($heads)"; exit 1; }
          test "$current" = "$EXPECTED_HEAD" || { echo "::error::migration history reached ${current}, not the expected ${EXPECTED_HEAD} -- a migration file is likely missing from this build"; exit 1; }

  provisioning:
    name: provisioning — ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: provisioning/requirements-dev.txt
      - run: pip install -r provisioning/requirements-dev.txt
      - name: Dependency consistency
        run: pip check
      - name: Ruff lint
        run: ruff check src tests
        working-directory: provisioning
      - name: Ruff format
        run: ruff format --check src tests
        working-directory: provisioning
      - name: pytest
        # These tests parse the real docker-compose.yml at ../../docker-compose.yml
        # (tests/…/parents[2]). They fail loudly if it is missing rather than
        # skipping, which is the point — a sync test that cannot find its
        # counterpart proves nothing.
        run: PYTHONPATH=src python -m pytest -q
        working-directory: provisioning

  ui-frontend:
    name: ui — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Lint
        run: npm run lint
        working-directory: ui
      - name: Typecheck
        run: npm run typecheck
        working-directory: ui
      - name: Vitest
        run: npm run test
        working-directory: ui
      - name: Build
        # Also runs scripts/check-no-secrets-in-bundle.mjs as its own
        # `postbuild` step — a build with a secret in the shipped bundle
        # fails here, not in a later manual review (docs/UI-001-CLINICAL-UX.md
        # §8's boundary: no privileged credential in frontend JavaScript,
        # browser storage, or build artifacts).
        run: npm run build
        working-directory: ui

  clinical-config:
    name: seed + form-safety suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # ⚠️ `unittest discover` exits 0 when it finds NOTHING — "Ran 0 tests" is a
      # pass. Control-verified against an empty directory. So each suite asserts a
      # floor on the number of tests actually executed; otherwise a renamed
      # directory or a bad `-s` path would turn these guards off silently, which is
      # precisely the failure this repository has hit eight times. The floors are
      # minimums, not exact counts, so adding tests never breaks CI — but deleting
      # them does.
      - name: Maternity and prenatal-panel seed safety
        # Stdlib only, no dependencies. Enforces ADR-007's additive-only bed seed
        # and the deliberately EMPTY prenatal panel.
        run: |
          python -m unittest discover -s openmrs-config/seed -p 'test_*.py' -v 2>&1 | tee /tmp/seed.log
          ran=$(sed -n 's/^Ran \([0-9]*\) test.*/\1/p' /tmp/seed.log | tail -1)
          echo "seed tests executed: ${ran:-0}"
          test "${ran:-0}" -ge 16 || { echo "::error::expected at least 16 seed tests, ran ${ran:-0}"; exit 1; }
      - name: ADR-006 form safety guard
        # Refuses any form that performs clinical interpretation. If this ever
        # fails open, read ADR-006 before touching it.
        run: |
          python -m unittest discover -s openmrs-config/forms -p 'test_*.py' -v 2>&1 | tee /tmp/forms.log
          ran=$(sed -n 's/^Ran \([0-9]*\) test.*/\1/p' /tmp/forms.log | tail -1)
          echo "form-safety tests executed: ${ran:-0}"
          test "${ran:-0}" -ge 19 || { echo "::error::expected at least 19 form tests, ran ${ran:-0}"; exit 1; }

  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: .env must never be tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It holds real credentials and must stay gitignored."
            exit 1
          fi
          echo "ok — .env is not tracked"

      - name: No tracked secrets
        run: |
          # Deliberately narrow: assignments of long literal values to
          # secret-shaped names. Broad entropy scanning produces noise nobody
          # reads, and a check people learn to ignore is worse than none.
          #
          # ⚠️ Honest limitation: test trees are excluded, because fixtures
          # legitimately contain fake credentials (provisioning's backup tests
          # assert on a literal passphrase string). A real secret pasted into a
          # test would therefore be missed here. `.env` staying untracked is the
          # control that actually matters, and it is checked above.
          if git grep -nIE '(PASSWORD|PASSPHRASE|SECRET|TOKEN|PRIVATE_KEY)[A-Z_]*[=:][[:space:]]*['"'"'"]?[A-Za-z0-9/+._-]{12,}' \
               -- . ':(exclude).env.example' ':(exclude)*.md' \
                    ':(exclude)*/tests/*' ':(exclude)provisioning/demo/*' > /tmp/hits; then
            echo "::error::possible tracked secret:"; cat /tmp/hits; exit 1
          fi
          echo "ok — no secret-shaped assignments found"

      - name: Every image is pinned — no :latest, digests required
        run: |
          python - <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          def tracked(*patterns):
              out = subprocess.run(["git","ls-files",*patterns],capture_output=True,text=True).stdout
              return [p for p in out.splitlines() if p]

          bad = []

          # Compose `image:` references. Locally built daher-health/* images have
          # no registry digest by definition; their FROM bases are checked below.
          for path in ["docker-compose.yml", *tracked("provisioning/demo/*.yml")]:
              for n, line in enumerate(Path(path).read_text().splitlines(), 1):
                  m = re.match(r"\s*image:\s*(\S+)", line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith("daher-health/") or "daher-health/" in ref:
                      continue
                  if ":latest" in ref or ref.endswith(":latest"):
                      bad.append(f"{path}:{n} ':latest' is never allowed: {ref}")
                  elif "@sha256:" not in ref:
                      bad.append(f"{path}:{n} image without a digest: {ref}")

          # Dockerfile FROMs. A multi-stage `FROM base AS test` references an
          # earlier STAGE, not an image, so stage aliases are collected first and
          # skipped — an earlier version of this check flagged all five of them.
          for path in tracked("*Dockerfile", "*/Dockerfile"):
              text = Path(path).read_text()
              stages = set(re.findall(r"^FROM\s+\S+\s+AS\s+(\S+)", text, re.M | re.I))
              for n, line in enumerate(text.splitlines(), 1):
                  m = re.match(r"FROM\s+(\S+)", line, re.I)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref in stages or ref.startswith("daher-health/"):
                      continue
                  if ":latest" in ref:
                      bad.append(f"{path}:{n} ':latest' is never allowed: {ref}")
                  elif "@sha256:" not in ref:
                      bad.append(f"{path}:{n} FROM without a digest: {ref}")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — every external image reference is digest-pinned")
          PY

      - name: Compose invariants that a regression would silently undo
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          text = Path("docker-compose.yml").read_text()
          bad = []

          # Known bug 20. The caddy image runs `caddy` as PID 1 and Caddy does not reap
          # orphaned children, so every exec healthcheck leaked a zombie — ~5,760 PIDs a day
          # — until the cgroup pids limit was reached and NO process could start. The
          # container then reported UNHEALTHY for seven days while serving perfectly.
          # `init: true` puts docker-init at PID 1, which reaps. Removing it re-opens a fault
          # that takes days to appear and looks like something else entirely.
          block = re.search(r"\n  caddy:\n(.*?)(?=\n  [a-z0-9-]+:\n)", text, re.S)
          if block is None:
              bad.append("caddy service not found in docker-compose.yml")
          elif not re.search(r"^\s+init:\s*true\s*$", block.group(1), re.M):
              bad.append(
                  "caddy must keep `init: true` (known bug 20): without an init at PID 1, "
                  "exec healthchecks leak zombies until the container cannot start a process"
              )

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — compose invariants hold")
          PY

      - name: Shell syntax
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            sh -n "$f" 2>/dev/null || bash -n "$f" || { echo "::error::$f"; fail=1; }
          done
          exit $fail

      - name: JSON / XML / CSV parse
        run: |
          python - <<'PY'
          import csv, json, subprocess, sys
          import xml.etree.ElementTree as ET
          def tracked(pattern):
              out = subprocess.run(["git","ls-files",pattern],capture_output=True,text=True).stdout
              return [p for p in out.splitlines() if p]
          bad = []
          for p in tracked("*.json"):
              try: json.load(open(p, encoding="utf-8"))
              except Exception as e: bad.append(f"{p}: {e}")
          for p in tracked("*.xml"):
              try: ET.parse(p)
              except Exception as e: bad.append(f"{p}: {e}")
          for p in tracked("*.csv"):
              try:
                  with open(p, newline="", encoding="utf-8") as fh: list(csv.reader(fh))
              except Exception as e: bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — all tracked JSON/XML/CSV parse")
          PY

      - name: Relative documentation links resolve
        run: |
          # A doc set that cross-references itself is only useful if the
          # references are real. This has caught renames before.
          python - <<'PY'
          import os, re, subprocess, sys
          md = subprocess.run(["git","ls-files","*.md"],capture_output=True,text=True).stdout.split()
          link = re.compile(r"\]\((?!https?:|mailto:)([^)#]+)")
          bad = []
          for f in md:
              base = os.path.dirname(f)
              for target in link.findall(open(f, encoding="utf-8").read()):
                  if not os.path.exists(os.path.join(base, target)):
                      bad.append(f"{f} -> {target}")
          if bad:
              print("\n".join(f"::error::broken link: {b}" for b in bad)); sys.exit(1)
          print(f"ok — every relative link in {len(md)} documents resolves")
          PY

      - name: app.$BASE_DOMAIN origin and OpenMRS redirect reconciliation invariants
        # UI-004 (ADR-027). This cannot boot the real stack (a fresh clinical
        # cold boot is deliberately not part of CI — see this file's header),
        # so it asserts on the Caddyfile/reconcile-sso.sh text directly. The
        # live behavior (cookie hardening, the CSRF guard's actual 403/200
        # split, reconciliation's real idempotency against a running
        # Keycloak) was verified by hand against the pinned stack — see
        # PROJECT_STATE.md's UI-004 entry — and is not re-proven here on
        # every push, only guarded against silently regressing in the config
        # that produces it.
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          caddyfile = Path("caddy/Caddyfile").read_text()
          reconcile = Path("keycloak/reconcile-sso.sh").read_text()
          bad = []

          app_block_match = re.search(r"\napp\.\{\$BASE_DOMAIN\} \{(.*?)\n\}\n", caddyfile, re.S)
          if not app_block_match:
              bad.append("caddy/Caddyfile: no app.{$BASE_DOMAIN} block found")
          else:
              app_block = app_block_match.group(1)
              if "reverse_proxy openmrs-gateway:80" not in app_block:
                  bad.append("app. block does not reverse_proxy to openmrs-gateway:80")
              if "/openmrs/*" not in app_block:
                  bad.append("app. block does not handle /openmrs/*")
              if "X-Daher-App-Request" not in app_block:
                  bad.append("app. block is missing the CSRF custom-header guard")
              if not re.search(r"method\s+POST\s+PUT\s+PATCH\s+DELETE", app_block):
                  bad.append("app. block's CSRF guard does not cover POST/PUT/PATCH/DELETE")
              if "header_down Set-Cookie" not in app_block or "Secure" not in app_block or "SameSite=Lax" not in app_block:
                  bad.append("app. block does not harden OpenMRS's session cookie (Secure + SameSite=Lax)")
              if "daher-ui:80" not in app_block:
                  bad.append("app. block does not serve the daher-ui container as its fallback handler")

          for host in ["emr.{$BASE_DOMAIN}", "lab.{$BASE_DOMAIN}", "id.{$BASE_DOMAIN}"]:
              if host not in caddyfile:
                  bad.append(f"caddy/Caddyfile: {host} block is missing — a native origin regressed")

          # Cookie hardening must stay scoped to app. — emr.'s own session is
          # deliberately left as ADR-027 measured it, unhardened.
          emr_block_match = re.search(r"\nemr\.\{\$BASE_DOMAIN\} \{(.*?)\n\}\n", caddyfile, re.S)
          if emr_block_match and "SameSite=Lax" in emr_block_match.group(1):
              bad.append("emr. block appears to also rewrite cookies — hardening must stay scoped to app. only")

          if "daher_app_url" not in reconcile:
              bad.append("keycloak/reconcile-sso.sh: daher_app_url variable is missing")

          openmrs_block_match = re.search(r"openmrs_id=.*?>/dev/null", reconcile, re.S)
          if not openmrs_block_match or "$daher_app_url" not in openmrs_block_match.group(0):
              bad.append("reconcile-sso.sh: the openmrs client update does not include $daher_app_url")
          if openmrs_block_match and "$openmrs_public_url/*" not in openmrs_block_match.group(0):
              bad.append("reconcile-sso.sh: the openmrs client update lost its own emr. redirect entry")

          # UI-005 measured OpenELIS's SAML ACS as per-request, app-origin-derived, and
          # UI-011 (DH-008F) applied that: the openelis client must now ALSO carry the
          # app. origin, additively, alongside its existing lab. entries — never
          # replacing them, since lab.$BASE_DOMAIN must keep working natively.
          openelis_block_match = re.search(r"openelis_id=.*?reconcile_mapper", reconcile, re.S)
          if not openelis_block_match or "$daher_app_url" not in openelis_block_match.group(0):
              bad.append("reconcile-sso.sh: the openelis client update does not include $daher_app_url (UI-011)")
          if openelis_block_match and "$openelis_public_url/*" not in openelis_block_match.group(0):
              bad.append("reconcile-sso.sh: the openelis client update lost its own lab. redirect entry")

          if app_block_match:
              app_block = app_block_match.group(1)
              if "reverse_proxy https://openelis-webapp:8443" not in app_block:
                  bad.append("app. block does not reverse_proxy to openelis-webapp:8443 (UI-011)")
              if "/OpenELIS-Global/*" not in app_block:
                  bad.append("app. block does not handle /OpenELIS-Global/* (UI-011)")
              if "tls_trusted_ca_certs /etc/caddy/ca/openelis-ca.pem" not in app_block:
                  bad.append("app. block's OpenELIS route is missing the trust-anchor lab. already uses")
              # UI-005 measured OpenELIS's own cookie as already Secure; HttpOnly;
              # SameSite=Strict — stricter than OpenMRS's — so unlike the OpenMRS handle
              # above, this route must NOT rewrite Set-Cookie: there is nothing to harden,
              # and weakening SameSite=Strict merely to look consistent would regress it.
              openelis_handle_match = re.search(
                  r"handle /OpenELIS-Global/\*\s*\{(.*?)\n\t\t\}", app_block, re.S
              )
              if openelis_handle_match and "header_down Set-Cookie" in openelis_handle_match.group(1):
                  bad.append(
                      "app. block's OpenELIS route rewrites Set-Cookie — SameSite=Strict "
                      "must not be weakened (UI-011)"
                  )

          # daher-ui must only be reachable through Caddy's app. route — a
          # published host port would let a client bypass the CSRF guard
          # above entirely by talking to the container directly.
          compose = Path("docker-compose.yml").read_text()
          daher_ui_block = re.search(r"\n  daher-ui:\n(.*?)(?=\n  [a-z0-9-]+:\n)", compose, re.S)
          if not daher_ui_block:
              bad.append("docker-compose.yml: daher-ui service not found")
          elif re.search(r"^\s*ports:\s*$", daher_ui_block.group(1), re.M):
              bad.append("docker-compose.yml: daher-ui must not publish host ports — only Caddy may")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — app. origin, OpenMRS redirect reconciliation, and native-origin regressions all check out")
          PY

      - name: ADR-017B — Daher Reception is registration-only, additive, unchanged for existing roles
        # This cannot boot the real stack (see this file's header), so it asserts
        # on the committed config directly. The live mechanism — that a Keycloak
        # CLIENT role on `openmrs`, name-matched literally against an OpenMRS
        # Role, is what the unmodified oauth2login sync actually reads (NOT
        # daher-realm.json's realm-level roles, which are inert for OpenMRS and
        # load-bearing only for OpenELIS's SAML mapper) — was measured live
        # against the disposable stack this ticket, not assumed. See
        # PROJECT_STATE.md's ADR-017B entry for the runtime proof.
        run: |
          python - <<'PY'
          import csv, json, re, sys
          from pathlib import Path

          bad = []

          # 1. The three existing realm-level roles are untouched, and no
          #    fourth was added there — a realm-level "reception" entry would
          #    be misleading (it would imply OpenELIS/SAML participation that
          #    reception, registration-only, never has).
          realm = json.loads(Path("keycloak/realm-config/daher-realm.json").read_text())
          realm_role_names = sorted(r["name"] for r in realm.get("roles", {}).get("realm", []))
          if realm_role_names != ["clinician", "lab-tech", "sys-admin"]:
              bad.append(
                  "daher-realm.json roles.realm must stay exactly "
                  f"[clinician, lab-tech, sys-admin], found {realm_role_names}"
              )

          # 2. reconcile-sso.sh creates/updates exactly the "Daher Reception"
          #    client role on the openmrs client, additively (its own function,
          #    never touching the openmrs/openelis client-update blocks above).
          reconcile = Path("keycloak/reconcile-sso.sh").read_text()
          if "reconcile_client_role" not in reconcile:
              bad.append("reconcile-sso.sh: reconcile_client_role function is missing")
          if 'reconcile_client_role "$openmrs_id" "Daher Reception"' not in reconcile:
              bad.append("reconcile-sso.sh: does not reconcile the Daher Reception client role on openmrs")
          if "roles-by-id" not in reconcile:
              bad.append(
                  "reconcile-sso.sh: reconcile_client_role must update via the "
                  "realm-root roles-by-id endpoint (kcadm does not URL-encode "
                  "spaces in a name-in-path lookup — proven live this ticket)"
              )

          # 3. The OpenMRS-side role CSV grants exactly the three privileges
          #    ADR-017A proved sufficient — nothing broader, ever.
          APPROVED = {"Edit Patient Identifiers", "Add Patients", "Get Patients"}
          FORBIDDEN = {"Add Encounters", "Assign Beds", "Edit Patients", "Get Encounters"}
          csv_path = Path("openmrs-config/initializer/roles/roles-daher.csv")
          if not csv_path.exists():
              bad.append("openmrs-config/initializer/roles/roles-daher.csv is missing")
          else:
              with csv_path.open(newline="", encoding="utf-8") as fh:
                  rows = list(csv.DictReader(fh))
              reception_rows = [r for r in rows if r.get("Role name") == "Daher Reception"]
              if len(reception_rows) != 1:
                  bad.append(f"roles-daher.csv: expected exactly one Daher Reception row, found {len(reception_rows)}")
              else:
                  row = reception_rows[0]
                  privileges = {p.strip() for p in row.get("Privileges", "").split(";") if p.strip()}
                  if privileges != APPROVED:
                      bad.append(
                          f"roles-daher.csv: Daher Reception privileges must be exactly {sorted(APPROVED)}, "
                          f"found {sorted(privileges)}"
                      )
                  hit = privileges & FORBIDDEN
                  if hit:
                      bad.append(f"roles-daher.csv: Daher Reception must never carry {sorted(hit)}")
                  if row.get("Inherited roles", "").strip():
                      bad.append("roles-daher.csv: Daher Reception must not inherit any other role")
                  # Do not silently redefine an upstream built-in role name.
                  UPSTREAM = {
                      "Privilege Level: Full", "Privilege Level: High",
                      "Organizational: Doctor", "Organizational: Nurse",
                      "Organizational: Registration Clerk",
                      "Organizational: System Administrator",
                  }
                  if row.get("Role name") in UPSTREAM:
                      bad.append("roles-daher.csv must not reuse an upstream built-in role name")

          # 4. The mount that actually delivers roles-daher.csv to OpenMRS at
          #    boot exists — a CSV nobody mounts is written, not provisioned.
          compose = Path("docker-compose.yml").read_text()
          if "openmrs-config/initializer/roles:/openmrs/distribution/openmrs_config/roles/zz-daher-health:ro" not in compose:
              bad.append("docker-compose.yml: the roles Initializer directory is not mounted into the openmrs-backend service")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — Daher Reception stays registration-only, additive, and existing roles are untouched")
          PY

      - name: ADR-017D — Daher Clinician Admission is self-contained, clinician-only, unreachable from reception
        # ADR-017C proved Add Visits/Add Encounters are blanket, unscopable
        # privileges in this OpenMRS distribution — no native way to restrict
        # either to a specific type or location. ADR-017D's response is
        # organizational, not technical: admission stays behind a SEPARATE
        # Daher-owned role, granted only to clinicians, with zero inheritance
        # path to or from Daher Reception. This guard cannot boot the real
        # stack (see this file's header); it asserts on committed config.
        # See PROJECT_STATE.md's ADR-017D entry for the runtime proof.
        run: |
          python - <<'PY'
          import csv, sys
          from pathlib import Path

          bad = []

          APPROVED_ADMISSION = {
              "Get Patients", "Get Visit Types", "Add Visits", "Get Visits",
              "Get Visit Attribute Types", "Get Beds", "Get Admission Locations",
              "Add Encounters", "Get Encounters",
          }
          # Registration-write privileges (beyond the shared Get Patients read)
          # and administrative privileges must never appear on the admission
          # role — it must not become a second, broader reception role.
          FORBIDDEN_ADMISSION = {
              "Add Patients", "Edit Patient Identifiers", "Edit Patients",
              "Assign Beds", "Edit Encounters",
              "Manage Roles", "Add Users", "Edit Users", "Delete Users",
              "Manage Privileges", "Manage Global Properties",
          }
          # Daher Reception must never gain any admission-shaped privilege,
          # in addition to the exact-three-privileges check ADR-017B already runs.
          FORBIDDEN_RECEPTION_ADMISSION = {
              "Add Visits", "Add Encounters", "Get Encounters",
              "Get Beds", "Get Admission Locations",
          }

          csv_path = Path("openmrs-config/initializer/roles/roles-daher.csv")
          if not csv_path.exists():
              bad.append("openmrs-config/initializer/roles/roles-daher.csv is missing")
          else:
              with csv_path.open(newline="", encoding="utf-8") as fh:
                  rows = list(csv.DictReader(fh))

              admission_rows = [r for r in rows if r.get("Role name") == "Daher Clinician Admission"]
              if len(admission_rows) != 1:
                  bad.append(f"roles-daher.csv: expected exactly one Daher Clinician Admission row, found {len(admission_rows)}")
              else:
                  row = admission_rows[0]
                  privileges = {p.strip() for p in row.get("Privileges", "").split(";") if p.strip()}
                  if privileges != APPROVED_ADMISSION:
                      bad.append(
                          f"roles-daher.csv: Daher Clinician Admission privileges must be exactly "
                          f"{sorted(APPROVED_ADMISSION)}, found {sorted(privileges)}"
                      )
                  hit = privileges & FORBIDDEN_ADMISSION
                  if hit:
                      bad.append(f"roles-daher.csv: Daher Clinician Admission must never carry {sorted(hit)}")
                  if row.get("Inherited roles", "").strip():
                      bad.append("roles-daher.csv: Daher Clinician Admission must not inherit any other role (self-contained by design)")
                  UPSTREAM = {
                      "Privilege Level: Full", "Privilege Level: High",
                      "Organizational: Doctor", "Organizational: Nurse",
                      "Organizational: Registration Clerk",
                      "Organizational: System Administrator",
                  }
                  if row.get("Role name") in UPSTREAM:
                      bad.append("roles-daher.csv must not reuse an upstream built-in role name")

              reception_rows = [r for r in rows if r.get("Role name") == "Daher Reception"]
              if len(reception_rows) == 1:
                  row = reception_rows[0]
                  privileges = {p.strip() for p in row.get("Privileges", "").split(";") if p.strip()}
                  hit = privileges & FORBIDDEN_RECEPTION_ADMISSION
                  if hit:
                      bad.append(f"roles-daher.csv: Daher Reception must never carry {sorted(hit)} (ADR-017D)")
                  if row.get("Inherited roles", "").strip():
                      bad.append("roles-daher.csv: Daher Reception must not inherit Daher Clinician Admission or any other role")

          # reconcile-sso.sh must reconcile the new client role additively —
          # same idempotent create-or-update-description function ADR-017B
          # already proved, never a delete of any client role.
          reconcile = Path("keycloak/reconcile-sso.sh").read_text()
          if 'reconcile_client_role "$openmrs_id" "Daher Clinician Admission"' not in reconcile:
              bad.append("reconcile-sso.sh: does not reconcile the Daher Clinician Admission client role on openmrs")
          # Roles are additive-only (may carry real staff assignment history);
          # mappers are stateless claim configuration and ADR-017E2 legitimately
          # deletes a superseded one via remove_mapper_if_present — narrowed to
          # the specific dangerous shape (a role deletion call) rather than the
          # bare word "delete", which that helper's own body also contains.
          if 'delete "clients/$client_id/roles' in reconcile or 'delete "roles-by-id' in reconcile:
              bad.append("reconcile-sso.sh: must never delete a Keycloak client role — reconciliation is additive-only for roles")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — Daher Clinician Admission is self-contained, clinician-only, and unreachable from reception")
          PY

      - name: ADR-017E2 — Provider identity is role-derived, fail-closed, and a single mechanism
        # ADR-017E found no supported Keycloak protocol mapper can emit a
        # deterministic, fail-closed "provider" claim conditional on client-role
        # membership: oauth2login defaults a genuinely absent claim to
        # activated (fail-open), and every mapper-based candidate tried either
        # produced a non-deterministic value or lost to a competing mapper
        # under undefined precedence. ADR-017E2's fix instead patches
        # oauth2login itself (openmrs-config/patches/oauth2login-bridge/
        # OAuth2LoginController.java.patch) to derive Provider activation from
        # the same "roles" claim OpenMRS role assignment already consumes —
        # exact "Provider" client-role membership, nothing else — and removes
        # the now-superseded unconditional provider claim mapper everywhere.
        # This guard cannot boot the real stack (see this file's header); it
        # asserts on committed config and patch source. See PROJECT_STATE.md's
        # ADR-017E2 entry for the runtime proof.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          bad = []

          patch_path = Path("openmrs-config/patches/oauth2login-bridge/OAuth2LoginController.java.patch")
          if not patch_path.exists():
              bad.append("OAuth2LoginController.java.patch is missing")
              patch_text = ""
          else:
              patch_text = patch_path.read_text()

              # The role-derived decision method must exist and be wired into login().
              if "isProviderRoleGranted" not in patch_text:
                  bad.append("OAuth2LoginController.java.patch: isProviderRoleGranted is missing")
              if "if (isProviderRoleGranted(userInfo))" not in patch_text:
                  bad.append("OAuth2LoginController.java.patch: login() does not call isProviderRoleGranted")

              # Upstream's own fail-open check must be removed (a "-" diff line),
              # not reintroduced on an added ("+") line — the patch file's "-"
              # lines legitimately still show the old code being deleted.
              added_lines = [l for l in patch_text.splitlines() if l.startswith("+")]
              if any('userInfo.getString(UserInfo.PROP_PROVIDER, "true")' in l for l in added_lines):
                  bad.append("OAuth2LoginController.java.patch: still reads the legacy fail-open provider claim")

              # Exact membership only — the constant must be the literal role name,
              # checked via List.contains (exact equals), never a case-folded or
              # substring-style comparison.
              if 'DAHER_PROVIDER_ROLE_NAME = "Provider"' not in patch_text:
                  bad.append('OAuth2LoginController.java.patch: DAHER_PROVIDER_ROLE_NAME must be exactly "Provider"')
              if "roleNames.contains(DAHER_PROVIDER_ROLE_NAME)" not in patch_text:
                  bad.append("OAuth2LoginController.java.patch: role check must be exact List.contains membership")
              for bad_pattern in (".toLowerCase()", ".indexOf(", ".startsWith(", ".matches(", "Reception"):
                  if bad_pattern in patch_text:
                      bad.append(f"OAuth2LoginController.java.patch: unexpected pattern {bad_pattern!r} near the role check")

              # Fails closed, not open, on a missing/null/malformed claim.
              if "catch (RuntimeException e)" not in patch_text or "return false;" not in patch_text:
                  bad.append("OAuth2LoginController.java.patch: does not fail closed on a missing/malformed roles claim")

          dockerfile = Path("openmrs-config/Dockerfile").read_text()
          if "OAuth2LoginController.java.patch" not in dockerfile:
              bad.append("Dockerfile: does not apply OAuth2LoginController.java.patch")
          if "git -C /src apply /patch/OAuth2LoginController.java.patch" not in dockerfile:
              bad.append("Dockerfile: does not git apply OAuth2LoginController.java.patch")

          # Exactly one provider-claim mechanism must exist overall: the patched
          # Java logic above. No Keycloak mapper anywhere may still emit a
          # "provider" claim — hardcoded true, hardcoded false, or otherwise —
          # since that would be a second, competing, precedence-undefined
          # mechanism (ADR-017E's own finding).
          for path in Path("keycloak").rglob("*.json"):
              text = path.read_text()
              if "provider" in text.lower():
                  bad.append(f"{path}: must not reference a provider claim — the Java patch is the sole mechanism now")

          stale_mapper = Path("keycloak/mappers/openmrs-provider-disabled-mapper.json")
          if stale_mapper.exists():
              bad.append(f"{stale_mapper} must be removed — superseded by the role-derived patch")

          reconcile = Path("keycloak/reconcile-sso.sh").read_text()
          if 'reconcile_mapper "$openmrs_id" "provider disabled until approved"' in reconcile:
              bad.append("reconcile-sso.sh: still reconciles (recreates) the superseded provider-disabled mapper")
          if 'remove_mapper_if_present "$openmrs_id" "provider disabled until approved"' not in reconcile:
              bad.append("reconcile-sso.sh: does not remove the superseded provider-disabled mapper on existing realms")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — Provider identity is role-derived, fails closed, and exactly one mechanism exists")
          PY

  compose:
    name: compose interpolates and parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate a throwaway env file
        run: |
          # The compose file guards 17 variables with ${VAR:?} so a missing value
          # fails loudly at `up` instead of quietly selecting a published default
          # (bug 14). That guard is exactly why CI cannot use .env.example, which
          # correctly ships those values EMPTY.
          #
          # These are not secrets and are never used against a real service — they
          # exist so `${VAR:?}` has something to interpolate. `config` does not
          # validate password content, so they are deliberately kept SHORT: under
          # the tracked-secret scan's 12-character threshold, so this workflow does
          # not trip its own check. Excluding .github/ from that scan would have
          # been the lazy fix and would blind it to a real token pasted into CI.
          #
          # Written OUTSIDE the checkout and passed with --env-file, so running
          # this workflow locally (act) can never overwrite a developer's real
          # .env. That file holds live credentials.
          cat > "$RUNNER_TEMP/ci.env" <<'ENVEOF'
          BASE_DOMAIN=localhost
          OMRS_DB_NAME=openmrs
          OMRS_DB_USER=openmrs
          OMRS_DB_PASSWORD=ci-dummy
          OMRS_DB_ROOT_PASSWORD=ci-dummy
          OMRS_ADMIN_PASSWORD=CiDummy1
          OE_DB_PASSWORD=ci-dummy
          OE_DB_SUPERUSER_PASSWORD=ci-dummy
          OE_POSTGRES_PASSWORD=ci-dummy
          OE_ADMIN_PASSWORD=CiTest1!
          OE_KEYSTORE_PASSWORD=ci-dummy
          OE_TRUSTSTORE_PASSWORD=ci-dummy
          KEYCLOAK_DB_PASSWORD=ci-dummy
          KEYCLOAK_ADMIN_PASSWORD=ci-dummy
          KEYCLOAK_OPENMRS_CLIENT_SECRET=ci-dummy
          KEYCLOAK_ADAPTER_CLIENT_SECRET=ci-dummy
          ADAPTER_DB_PASSWORD=ci-dummy
          ENVEOF
      - name: Default profile parses
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" config -q
      - name: backup profile parses
        run: COMPOSE_PROFILES=backup docker compose --env-file "$RUNNER_TEMP/ci.env" config -q
      - name: Demo compose parses
        run: docker compose -f provisioning/demo/docker-compose.demo.yml config -q
      - name: A real .env must never have appeared in the checkout
        run: |
          test ! -f .env || { echo "::error::a .env exists in the checkout"; exit 1; }
          rm -f "$RUNNER_TEMP/ci.env"; echo ok
