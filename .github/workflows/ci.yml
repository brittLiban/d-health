              if "for (DaherAnalysisCorrelation correlation : addedTestCorrelations)" in ft_added:
                  bad.append("FhirTransformServiceImpl.java.patch: still loops over multiple "
                              "added-test correlations -- DH-011P3 §4 requires failing closed, "
                              "never emitting several source-event identifiers for one Analysis")

          # --- shared constants file ---
          shared_path = base / "DaherOrderCorrelation.java"
          if not shared_path.exists():
              bad.append("DaherOrderCorrelation.java is missing")
          else:
              shared_text = shared_path.read_text()
              if 'SYSTEM = "urn:daher-health:adapter:source-event"' not in shared_text:
                  bad.append("DaherOrderCorrelation.java: SYSTEM constant does not match the adapter's own value")
              if "VALUE_PATTERN" not in shared_text or "0-9a-f" not in shared_text:
                  bad.append("DaherOrderCorrelation.java: VALUE_PATTERN is missing or not hex-digest-shaped")

          # --- uniqueness migration: scoped partial unique index, not a blanket one ---
          migration_path = base / "001-electronic-order-daher-correlation-unique.xml"
          if not migration_path.exists():
              bad.append("001-electronic-order-daher-correlation-unique.xml is missing")
          else:
              migration_text = migration_path.read_text()
              if "CREATE UNIQUE INDEX" not in migration_text:
                  bad.append("uniqueness migration: no CREATE UNIQUE INDEX statement")
              if "WHERE type = 'FHIR'" not in migration_text:
                  bad.append("uniqueness migration: not scoped to type='FHIR' -- would collide with "
                              "existing HL7/CSV rows that deliberately tolerate duplicate external_id")
              if "<rollback>" not in migration_text:
                  bad.append("uniqueness migration: no rollback block")

          # --- base-changelog.xml.patch actually wires the migration in ---
          changelog_patch_path = base / "base-changelog.xml.patch"
          if not changelog_patch_path.exists():
              bad.append("base-changelog.xml.patch is missing")
          else:
              changelog_added = "\n".join(
                  l for l in changelog_patch_path.read_text().splitlines() if l.startswith("+")
              )
              if "liquibase/daher/001-electronic-order-daher-correlation-unique.xml" not in changelog_added:
                  bad.append("base-changelog.xml.patch: does not include the new migration file")
              if "liquibase/daher/004-daher-analysis-correlation.xml" not in changelog_added:
                  bad.append("base-changelog.xml.patch: does not include the DH-011P added-test correlation migration")
              if "liquibase/daher/005-daher-analysis-correlation-unique-analysis.xml" not in changelog_added:
                  bad.append("base-changelog.xml.patch: does not include the DH-011P3 analysis_id uniqueness migration")

          # --- DH-011P (Design B): per-added-test correlation table + entity ---
          added_test_migration_path = base / "004-daher-analysis-correlation.xml"
          if not added_test_migration_path.exists():
              bad.append("004-daher-analysis-correlation.xml is missing")
          else:
              atm_text = added_test_migration_path.read_text()
              if "CREATE TABLE daher_analysis_correlation" not in atm_text:
                  bad.append("004-daher-analysis-correlation.xml: no CREATE TABLE daher_analysis_correlation")
              if "REFERENCES clinlims.analysis (id)" not in atm_text:
                  bad.append("004-daher-analysis-correlation.xml: analysis_id has no FK to clinlims.analysis")
              if "daher_analysis_correlation_value_uk" not in atm_text or "CREATE UNIQUE INDEX" not in atm_text:
                  bad.append("004-daher-analysis-correlation.xml: no UNIQUE index on correlation_value")
              if "<rollback>" not in atm_text:
                  bad.append("004-daher-analysis-correlation.xml: no rollback block")
              # 004 itself still does not enforce UNIQUE(analysis_id) -- that constraint is added
              # by the separate, later migration 005 (DH-011P3), not by editing 004 in place. This
              # check only asserts 004's own historical content is unchanged; it does NOT mean
              # analysis_id is unenforced overall -- see the 005 checks below.
              if "UNIQUE (analysis_id)" in atm_text or "UNIQUE(analysis_id)" in atm_text:
                  bad.append("004-daher-analysis-correlation.xml: must not enforce UNIQUE(analysis_id) "
                              "directly -- that belongs in 005, a separate migration, per Liquibase's "
                              "own already-applied-changeset discipline")

          # --- DH-011P3: analysis_id uniqueness, enforced by a separate migration ---
          unique_analysis_migration_path = base / "005-daher-analysis-correlation-unique-analysis.xml"
          if not unique_analysis_migration_path.exists():
              bad.append("005-daher-analysis-correlation-unique-analysis.xml is missing")
          else:
              uam_text = unique_analysis_migration_path.read_text()
              # The exact statement, not just the two tokens present anywhere -- a prose comment
              # mentioning "CREATE UNIQUE INDEX" must not satisfy this check (control-tested).
              if "CREATE UNIQUE INDEX daher_analysis_correlation_analysis_uk" not in uam_text:
                  bad.append("005-daher-analysis-correlation-unique-analysis.xml: no UNIQUE index on analysis_id")
              if "ON daher_analysis_correlation (analysis_id)" not in uam_text:
                  bad.append("005-daher-analysis-correlation-unique-analysis.xml: unique index is not on analysis_id")
              if "<rollback>" not in uam_text:
                  bad.append("005-daher-analysis-correlation-unique-analysis.xml: no rollback block")
              # Fails safely via Postgres's own atomic CREATE UNIQUE INDEX, not custom
              # duplicate-detection SQL that could itself delete/merge/rewrite rows.
              for destructive in ("DELETE FROM", "DELETE\n", "TRUNCATE", "UPDATE daher_analysis_correlation"):
                  if destructive in uam_text:
                      bad.append("005-daher-analysis-correlation-unique-analysis.xml: contains a "
                                  f"{destructive!r}-shaped statement -- this migration must fail safely on "
                                  "existing duplicates, never delete/merge/rewrite rows automatically")

          entity_path = base / "DaherAnalysisCorrelation.java"
          if not entity_path.exists():
              bad.append("DaherAnalysisCorrelation.java is missing")
          else:
              entity_text = entity_path.read_text()
              if "@Entity" not in entity_text or '@Table(name = "daher_analysis_correlation"' not in entity_text:
                  bad.append("DaherAnalysisCorrelation.java: not mapped as a JPA @Entity on the right table")
              if "daher_analysis_correlation_analysis_uk" not in entity_text:
                  bad.append("DaherAnalysisCorrelation.java: JPA @Table does not declare the analysis_id "
                              "unique constraint (DH-011P3) -- entity mapping must match the DB schema")

          # --- no patch to the core Analysis mapping -- Design B is a standalone table only ---
          for forbidden in ("Analysis.java.patch", "Analysis.hbm.xml.patch"):
              if (base / forbidden).exists():
                  bad.append(f"{forbidden} exists -- DH-011P Design B forbids patching Analysis.java/"
                              "Analysis.hbm.xml directly; the correlation must live in a standalone table")

          # --- SampleEditServiceImpl.java.patch: shared-field race removed, not worked around ---
          seis_patch_path = base / "SampleEditServiceImpl.java.patch"
          if not seis_patch_path.exists():
              bad.append("SampleEditServiceImpl.java.patch is missing")
          else:
              seis_added = "\n".join(
                  l for l in seis_patch_path.read_text().splitlines() if l.startswith("+")
              )
              if "public List<String> editSample(" not in seis_added:
                  bad.append("SampleEditServiceImpl.java.patch: editSample does not return List<String>")
              if "analysisList = analysisIds" in seis_added:
                  bad.append("SampleEditServiceImpl.java.patch: still assigns to the shared analysisList "
                              "field -- the singleton-bean race this patch exists to remove")

          # --- ServiceRequestProvider.java.patch: dual-namespace lookup + transactional add path ---
          if sr_patch_path.exists():
              if "daherAnalysisCorrelationService" not in added_text or "getByCorrelationValue" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: searchDaherCorrelationNatively does not "
                              "query the added-test namespace")
              if "initialOrderNamespaceMatch && addedTestNamespaceMatch" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: no explicit cross-namespace collision check")
              if "daherAddedTestTransaction.addTest(" not in added_text:
                  bad.append("ServiceRequestProvider.java.patch: existing-specimen branch does not route "
                              "through the transactional DaherAddedTestTransaction seam")
              # No fuzzy matching in the new dual-namespace logic either (same discipline as the
              # existing extractDaherOrderIdentifier check above).
              for bad_pattern in (".toLowerCase()", ".toUpperCase()", ".contains(", ".startsWith(", ".indexOf("):
                  if bad_pattern in added_text:
                      bad.append(f"ServiceRequestProvider.java.patch: unexpected fuzzy-comparison pattern "
                                  f"{bad_pattern!r}")

          # --- DH-011J §12-13/§22: the $cancel operation and its transactional wrapper bean ---
          cancel_patch_path = base / "ServiceRequestProviderCancel.java.patch"
          if not cancel_patch_path.exists():
              bad.append("ServiceRequestProviderCancel.java.patch is missing")
              cancel_added = ""
          else:
              cancel_patch = cancel_patch_path.read_text()
              cancel_added = "\n".join(l for l in cancel_patch.splitlines() if l.startswith("+"))

              if '@Operation(name = "$cancel"' not in cancel_added:
                  bad.append("ServiceRequestProviderCancel.java.patch: does not add the $cancel "
                              "FHIR operation")
              # DH-011J §12: cancellation must never be a PUT -- the existing DH-011P2 §15 guard
              # below checks openelis.py; this checks the native side never grows an @Update/PUT
              # handler for cancellation either. Checked as an actual annotation-usage line (the
              # line, stripped of the diff "+" and leading whitespace, is exactly "@Update" or
              # starts with "@Update(" -- HAPI annotations in this file are used bare, e.g. the
              # pristine @Delete/@Create above), not a bare substring -- this patch's own javadoc
              # discusses "{@code @Update}/PUT" in prose, which a naive substring check would
              # misflag exactly as DH-011P3's "CREATE UNIQUE INDEX" false-negative did in reverse.
              cancel_code_lines = [
                  l[1:].strip() for l in cancel_patch.splitlines()
                  if l.startswith("+") and not l[1:].strip().startswith(("*", "//"))
              ]
              if any(l == "@Update" or l.startswith("@Update(") for l in cancel_code_lines) or any(
                  '"PUT"' in l or "'PUT'" in l for l in cancel_code_lines
              ):
                  bad.append("ServiceRequestProviderCancel.java.patch: contains a PUT/@Update "
                              "reference -- cancellation must be reachable only via the $cancel "
                              "operation (DH-011J §12), never PUT")
              if "@Transactional" in cancel_added:
                  bad.append("ServiceRequestProviderCancel.java.patch: adds @Transactional to "
                              "ServiceRequestProvider itself -- breaks HAPI's reflection-based "
                              "provider registration (HAPI-0289, see DaherAddedTestTransaction's "
                              "javadoc); the transaction boundary belongs on the separate "
                              "DaherCancellationTransaction bean only")
              if ("daherCancellationTransaction" not in cancel_added
                      or "cancelByCorrelation" not in cancel_added):
                  bad.append("ServiceRequestProviderCancel.java.patch: does not delegate to "
                              "DaherCancellationTransaction.cancelByCorrelation")
              # DH-011J §7 scope boundary: cancellation must resolve targets only through the
              # added-test correlation table, never the initial-order electronic_order namespace
              # -- whole-initial-order cancellation is Human Decision Required, not implemented.
              for token in ("electronicOrderService", "ElectronicOrder"):
                  if token in cancel_added:
                      bad.append(f"ServiceRequestProviderCancel.java.patch: references {token!r} -- "
                                  "cancellation must resolve targets only via the added-test "
                                  "daher_analysis_correlation namespace, never electronic_order "
                                  "(DH-011J §7: initial-order cancellation is Human Decision "
                                  "Required, not implemented)")

          cancel_txn_path = base / "DaherCancellationTransaction.java"
          if not cancel_txn_path.exists():
              bad.append("DaherCancellationTransaction.java is missing")
          else:
              cancel_txn_text = cancel_txn_path.read_text()
              if "@Transactional(rollbackFor = Exception.class)" not in cancel_txn_text:
                  bad.append("DaherCancellationTransaction.java: cancelByCorrelation is not "
                              "@Transactional(rollbackFor = Exception.class)")
              # ADR-018's policy, mapped to the verified native vocabulary (DH-011J): the ONE
              # status an automatic cancellation may proceed from is NotStarted ("Not Tested",
              # live-confirmed as the default status of every newly created Analysis). Any other
              # status is ADR-018's "already in progress" branch and must be refused, not
              # overwritten -- this is the exact guard the pristine deleteServiceRequest lacks.
              if "currentStatus != AnalysisStatus.NotStarted" not in cancel_txn_text:
                  bad.append("DaherCancellationTransaction.java: missing the ADR-018 status-gate "
                              "allowlist check (must refuse any status other than NotStarted)")
              if "currentStatus == AnalysisStatus.Canceled" not in cancel_txn_text:
                  bad.append("DaherCancellationTransaction.java: missing the idempotent "
                              "already-Canceled branch (§16)")
              # No hard deletes anywhere in the cancellation path (DH-011J §9) -- cancellation is
              # a status-only mutation, exactly like the pristine deleteServiceRequest's own
              # underlying mechanism.
              for bad_pattern in (
                  "DELETE FROM", "delete from", ".remove(", ".delete(", "TRUNCATE"
              ):
                  if bad_pattern in cancel_txn_text:
                      bad.append(f"DaherCancellationTransaction.java: contains {bad_pattern!r} -- "
                                  "cancellation must never hard-delete an Analysis or correlation "
                                  "row (DH-011J §9)")

          # --- DH-011P2 §15: OpenELIS's own updateServiceRequest (PUT) is reachable by the same
          # HTTP Basic credentials the Daher adapter would use (live-confirmed against the
          # disposable stack: authenticated, routed, fails only on payload validation) and has
          # a known latent duplicate-Analysis defect (PROVENANCE.md). It is NOT called by any
          # Daher code path today -- OpenElisClient defines no PUT-capable method at all. This
          # guard keeps that true: a regression here means someone wired a PUT for
          # ServiceRequest delivery without revisiting the §15 finding first.
          adapter_openelis_path = Path("adapter/src/daher_adapter/openelis.py")
          if not adapter_openelis_path.exists():
              bad.append("adapter/src/daher_adapter/openelis.py is missing")
          else:
              adapter_openelis_text = adapter_openelis_path.read_text()
              if '"PUT"' in adapter_openelis_text or "'PUT'" in adapter_openelis_text:
                  bad.append("adapter/src/daher_adapter/openelis.py: contains a PUT method reference -- "
                              "OpenELIS's updateServiceRequest is UNSAFE/NOT SUPPORTED FOR DAHER V1 "
                              "(DH-011P2 §15); the adapter must remain POST-only for ServiceRequest "
                              "delivery until that finding is explicitly revisited")
              if "OpenElisPut" in adapter_openelis_text or "def update_service_request" in adapter_openelis_text:
                  bad.append("adapter/src/daher_adapter/openelis.py: defines a PUT-shaped delivery "
                              "method -- see DH-011P2 §15 before adding one")
              # DH-011J §12: the cancellation writer must reach the native $cancel operation via
              # POST, never a PUT-shaped "$update"/instance-PATCH call.
              if "def cancel_service_request" not in adapter_openelis_text:
                  bad.append("adapter/src/daher_adapter/openelis.py: cancel_service_request is "
                              "missing -- DH-011J's adapter-side cancellation writer")
              elif "/$cancel" not in adapter_openelis_text:
                  bad.append("adapter/src/daher_adapter/openelis.py: cancel_service_request does "
                              "not call the native $cancel operation")

          # --- DH-011G2 (LIBAN DECISION: SELECT OPTION D): native OpenMRS-UUID <-> OpenELIS
          # Patient linkage. §23's required guards: the Daher patient identity system is
          # recognized natively; pat_nationalId/pat_subjectNumber/pat_stNumber/pat_guid are never
          # reused as a semantic substitute (Option B was rejected, see DECISIONS.md); the
          # linkage table has its FK and both unique constraints; native search is exact-match
          # only, never a demographic fallback; create-and-link is one transaction; every shipped
          # patch is compiled in CI (checked against this very workflow file below, not just the
          # Dockerfile).
          pp_patch_path = base / "PatientProvider.java.patch"
          if not pp_patch_path.exists():
              bad.append("PatientProvider.java.patch is missing")
              pp_added = ""
          else:
              pp_patch = pp_patch_path.read_text()
              pp_added = "\n".join(l for l in pp_patch.splitlines() if l.startswith("+"))
              # Code only, comments excluded (same technique the ServiceRequestProviderCancel
              # check above uses for its own "@Update"/"PUT" scan) -- this patch's own javadoc
              # legitimately names pat_nationalId/pat_guid in prose explaining they are NOT
              # reused, which a whole-file substring check would otherwise misflag.
              pp_code_lines = [
                  l[1:].strip() for l in pp_patch.splitlines()
                  if l.startswith("+") and not l[1:].strip().startswith(("*", "//"))
              ]
              pp_code = "\n".join(pp_code_lines)

              if "extractDaherPatientIdentifier" not in pp_added:
                  bad.append("PatientProvider.java.patch: extractDaherPatientIdentifier is missing")
              if "final String openmrsPatientUuid = extractDaherPatientIdentifier(fhirPatient);" not in pp_added:
                  bad.append("PatientProvider.java.patch: createPatient does not call extraction")
              if "searchDaherPatientIdentityNatively" not in pp_added:
                  bad.append("PatientProvider.java.patch: native search routing is missing")
              if "daherPatientIdentityTransaction.persist(" not in pp_added:
                  bad.append("PatientProvider.java.patch: createPatient does not route the native "
                              "persist + linkage insert through DaherPatientIdentityTransaction "
                              "(§9's atomic create-and-link requirement)")
              if "attachDaherIdentifierIfLinked" not in pp_added:
                  bad.append("PatientProvider.java.patch: outbound FHIR representation does not "
                              "echo the Daher identifier (§15)")

              # Exact-one-match selection rules on both the create-time uniqueness pre-check and
              # the native search's own data-integrity checks -- zero and multiple must both be
              # handled, never picked-first.
              if "matches.size() > 1" not in pp_added:
                  bad.append("PatientProvider.java.patch: multiple-match fail-closed check is missing")
              if "DaherPatientIdentity.SYSTEM.equals(identifier.getSystem())" not in pp_added:
                  bad.append("PatientProvider.java.patch: identifier selection is not an exact system match")

              # §5/DECISIONS.md ADR: pat_nationalId etc. must never be treated as a Daher linkage
              # substitute anywhere in this patch's new CODE (pp_code excludes comment lines --
              # this javadoc legitimately names them in prose explaining they are NOT reused).
              for forbidden in ("pat_nationalId", "pat_subjectNumber", "pat_stNumber", "pat_guid"):
                  if forbidden in pp_code:
                      bad.append(f"PatientProvider.java.patch: references {forbidden!r} -- Option B "
                                  "(reusing a native OpenELIS identifier bucket for Daher linkage) "
                                  "was rejected; native buckets must keep their own meanings "
                                  "(DECISIONS.md ADR)")

              # No fuzzy comparison and no demographic fallback anywhere in the new logic --
              # identity must never be derived from name/DOB/gender matching (§8: "no demographic
              # fallback").
              for bad_pattern in (
                  ".toLowerCase()", ".toUpperCase()", ".contains(", ".startsWith(", ".indexOf(",
                  "getFamily()", "getGiven()", "getBirthDate()",
              ):
                  if bad_pattern in pp_code:
                      bad.append(f"PatientProvider.java.patch: unexpected fuzzy-matching/demographic "
                                  f"pattern {bad_pattern!r} -- native Daher identity lookup must be "
                                  "exact-token-only, never a demographic fallback")

              # No hard delete added to the Patient path (pristine PatientProvider.delete already
              # never hard-deletes -- this patch must not change that).
              for bad_pattern in ("DELETE FROM", "delete from", ".remove(", "TRUNCATE"):
                  if bad_pattern in pp_code:
                      bad.append(f"PatientProvider.java.patch: contains {bad_pattern!r} -- must never "
                                  "hard-delete a Patient row")

          link_entity_path = base / "DaherPatientIdentity.java"
          if not link_entity_path.exists():
              bad.append("DaherPatientIdentity.java is missing")
          else:
              link_entity_text = link_entity_path.read_text()
              if "@Entity" not in link_entity_text or '@Table(name = "daher_patient_identity"' not in link_entity_text:
                  bad.append("DaherPatientIdentity.java: not mapped as a JPA @Entity on the right table")
              if 'SYSTEM = "urn:daher-health:openmrs-patient-uuid"' not in link_entity_text:
                  bad.append("DaherPatientIdentity.java: SYSTEM constant does not match the adapter's own value")
              if ("daher_patient_identity_system_value_uk" not in link_entity_text
                      or "daher_patient_identity_patient_system_uk" not in link_entity_text):
                  bad.append("DaherPatientIdentity.java: JPA @Table does not declare both unique "
                              "constraints -- entity mapping must match the DB schema")

          link_txn_path = base / "DaherPatientIdentityTransaction.java"
          if not link_txn_path.exists():
              bad.append("DaherPatientIdentityTransaction.java is missing")
          else:
              link_txn_text = link_txn_path.read_text()
              if "@Transactional(rollbackFor = Exception.class)" not in link_txn_text:
                  bad.append("DaherPatientIdentityTransaction.java: persist is not "
                              "@Transactional(rollbackFor = Exception.class)")
              if "patientService.persistPatientData(" not in link_txn_text:
                  bad.append("DaherPatientIdentityTransaction.java: does not persist the native Patient")
              if "daherPatientIdentityService.insert(" not in link_txn_text:
                  bad.append("DaherPatientIdentityTransaction.java: does not insert the linkage row "
                              "in the same transaction as the native Patient persist")

          link_migration_path = base / "006-daher-patient-identity.xml"
          if not link_migration_path.exists():
              bad.append("006-daher-patient-identity.xml is missing")
          else:
              lm_text = link_migration_path.read_text()
              if "CREATE TABLE daher_patient_identity" not in lm_text:
                  bad.append("006-daher-patient-identity.xml: no CREATE TABLE daher_patient_identity")
              if "REFERENCES clinlims.patient (id)" not in lm_text:
                  bad.append("006-daher-patient-identity.xml: patient_id has no FK to clinlims.patient")
              if ("CREATE UNIQUE INDEX daher_patient_identity_system_value_uk" not in lm_text
                      or "CREATE UNIQUE INDEX daher_patient_identity_patient_system_uk" not in lm_text):
                  bad.append("006-daher-patient-identity.xml: missing one or both required unique "
                              "indexes (identifier_system+identifier_value, patient_id+identifier_system)")
              if "<rollback>" not in lm_text:
                  bad.append("006-daher-patient-identity.xml: no rollback block")
              # Fails safely: no destructive backfill/merge of pre-existing patients.
              for destructive in ("DELETE FROM", "TRUNCATE", "UPDATE clinlims.patient", "MERGE"):
                  if destructive in lm_text:
                      bad.append(f"006-daher-patient-identity.xml: contains a {destructive!r}-shaped "
                                  "statement -- this migration must not backfill/merge pre-existing "
                                  "patients (§18: never auto-link by demographic similarity)")

          changelog_patch_path = base / "base-changelog.xml.patch"
          if changelog_patch_path.exists():
              changelog_added_g2 = "\n".join(
                  l for l in changelog_patch_path.read_text().splitlines() if l.startswith("+")
              )
              if "liquibase/daher/006-daher-patient-identity.xml" not in changelog_added_g2:
                  bad.append("base-changelog.xml.patch: does not include the DH-011G2 patient "
                              "identity linkage migration")

          persistence_patch_path = base / "persistence.xml.patch"
          if persistence_patch_path.exists():
              persistence_added_g2 = "\n".join(
                  l for l in persistence_patch_path.read_text().splitlines() if l.startswith("+")
              )
              if "org.openelisglobal.dataexchange.fhir.DaherPatientIdentity" not in persistence_added_g2:
                  bad.append("persistence.xml.patch: does not register DaherPatientIdentity as a "
                              "JPA-managed class")

          # --- §23: every shipped patch must actually be compiled in CI, not just the Dockerfile.
          # The CI compile job (openelis-order-correlation-build below) keeps its own enumeration
          # of git-apply/cp steps, mirroring the Dockerfile's -- both must independently list
          # every DH-011G2 file, or this patch would ship in production while never having been
          # compiled by CI.
          #
          # Scoped to ONLY the openelis-order-correlation-build job's own text, not the whole
          # workflow file: this guard script itself lives inside ci.yml (in the "static" job,
          # above) and its own source necessarily contains these exact filenames/strings as
          # Python literals -- a whole-file search would therefore always find its own check and
          # could never fail no matter what the compile job actually does (control-tested: a
          # deliberately broken compile job with the apply line removed produced zero errors
          # against a whole-file search). Scoping to the job body between its own header and the
          # next top-level job's header is what makes this guard capable of failing at all.
          ci_workflow_text = Path(".github/workflows/ci.yml").read_text()
          job_start = ci_workflow_text.index("\n  openelis-order-correlation-build:")
          job_end = ci_workflow_text.index("\n  oauth2login-provider-tests:", job_start)
          ci_build_job_text = ci_workflow_text[job_start:job_end]

          ci_apply_marker = 'git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/PatientProvider.java.patch"'
          if ci_apply_marker not in ci_build_job_text:
              bad.append("ci.yml: openelis-order-correlation-build does not apply "
                          "PatientProvider.java.patch -- it would ship in the Dockerfile image "
                          "without ever having been compiled by CI")
          for required_ci_copy in (
              "DaherPatientIdentity.java",
              "DaherPatientIdentityTransaction.java",
              "DaherPatientIdentityDAO.java",
              "DaherPatientIdentityDAOImpl.java",
              "DaherPatientIdentityService.java",
              "DaherPatientIdentityServiceImpl.java",
              "006-daher-patient-identity.xml",
          ):
              if required_ci_copy not in ci_build_job_text:
                  bad.append(f"ci.yml: openelis-order-correlation-build does not install "
                              f"{required_ci_copy} -- it would ship in the Dockerfile image "
                              "without ever having been compiled by CI")

          # --- adapter side: the Daher patient-identity system, probe, and both writer shapes ---
          if adapter_openelis_path.exists():
              if 'PATIENT_IDENTITY_SYSTEM = "urn:daher-health:openmrs-patient-uuid"' not in adapter_openelis_text:
                  bad.append("adapter/src/daher_adapter/openelis.py: PATIENT_IDENTITY_SYSTEM "
                              "constant is missing or does not match the Java-side SYSTEM value")
              for required_fn in (
                  "def patient_identity_probe", "def create_openelis_patient",
                  "def ensure_openelis_patient",
              ):
                  if required_fn not in adapter_openelis_text:
                      bad.append(f"adapter/src/daher_adapter/openelis.py: {required_fn} is missing")
              # No reuse of the rejected native buckets in this file's actual CODE. Docstrings/
              # comments legitimately name pat_nationalId etc. in prose (PATIENT_IDENTITY_SYSTEM's
              # own docstring explains why they are NOT used) -- triple-quoted docstring bodies
              # and #-comment lines are stripped first so that prose does not trip this check.
              import re as _re
              adapter_code_only = _re.sub(r'"""[\s\S]*?"""', "", adapter_openelis_text)
              adapter_code_only = "\n".join(
                  l for l in adapter_code_only.splitlines() if not l.strip().startswith("#")
              )
              for forbidden in ("pat_nationalId", "pat_subjectNumber", "pat_stNumber", "pat_guid"):
                  if forbidden in adapter_code_only:
                      bad.append(f"adapter/src/daher_adapter/openelis.py: references {forbidden!r} "
                                  "in code -- Option B was rejected, native buckets must keep "
                                  "their own meanings (DECISIONS.md ADR)")

          if bad:
              print("\n".join(f"::error::{b}" for b in bad)); sys.exit(1)
          print("ok — DH-011D/DH-011P/DH-011P2/DH-011J/DH-011G2 order-correlation patch set has "
                "all required components, no forbidden fuzzy-matching patterns, the uniqueness "
                "index stays scoped to FHIR-typed rows, the added-test transform is "
                "correlation-aware, added-test cancellation is reachable only via $cancel with "
                "the ADR-018 status gate enforced, the adapter remains POST-only throughout, and "
                "the DH-011G2 patient-identity linkage never reuses a native OpenELIS identifier "
                "bucket, is exact-match-only with no demographic fallback, and is compiled by CI")
          PY

  openelis-order-correlation-build:
    # DH-011D3 (§14, independent review). The static guard above proves the committed patches'
    # *text* has the right shape -- it never compiles a single line of the patched Java or the
    # new Liquibase changesets. This job is the behavioral companion, mirroring
    # oauth2login-provider-tests below: it fetches the exact pinned OpenELIS-Global-2 source,
    # verifies the commit, initializes the pinned dataexport submodule, applies the SAME
    # committed patch files openelis-config/Dockerfile consumes (not a test-only duplicate --
    # the file list below is exactly the Dockerfile's COPY + git apply list), installs the new
    # source and migration files, and runs upstream's own build recipe through to a produced
    # WAR. There is no dedicated JUnit suite for this patch (unlike oauth2login's
    # ProviderRoleDerivationTest/FirstLoginAuthenticationTest) -- successful compilation of the
    # patched reactor, matching what Dockerfile actually ships, is what §14 requires.
    #
    # Runs inside the exact pinned Maven/JDK image the Dockerfile itself builds with.
    name: openelis order-correlation patch — compiles
    runs-on: ubuntu-latest
    container:
      image: maven:3-eclipse-temurin-21@sha256:8f6ac126f7810bb5549c4cd122d2bf0e9cda5bdeb0838aa928f09e779fd8bef8
    env:
      # Same pin openelis-config/Dockerfile and PROVENANCE.md record. Not read from those files
      # at run time on purpose -- see oauth2login-provider-tests' identical rationale below.
      OPENELIS_PINNED_TAG: 3.2.1.11
      OPENELIS_PINNED_COMMIT: e2a6bdf7999fa3754e7cdafbd2a91259c3f0ce23
      OPENELIS_SRC: /tmp/openelis-src
    steps:
      - uses: actions/checkout@v5

      - name: Install git and htpasswd
        # DH-011P: htpasswd (apache2-utils) is required by install/createDefaultPassword.sh,
        # which the compile step below runs. Without it, createDefaultPassword.sh retries in an
        # unbounded loop and this job never terminates -- found empirically while reproducing
        # this job locally for DH-011P, not caused by DH-011P's own changes (openelis-config
        # /Dockerfile's own build stage already installs apache2-utils for the same reason; this
        # job never did). See PROVENANCE.md's DH-011P section.
        run: apt-get update -qq && apt-get install -y -qq git apache2-utils

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: /root/.m2/repository
          key: m2-openelis-${{ env.OPENELIS_PINNED_COMMIT }}

      - name: Fetch exact pinned OpenELIS-Global-2 source and verify the commit
        run: |
          git clone --branch "$OPENELIS_PINNED_TAG" --depth 1 \
            https://github.com/DIGI-UW/OpenELIS-Global-2.git "$OPENELIS_SRC"
          actual="$(git -C "$OPENELIS_SRC" rev-parse HEAD)"
          if [ "$actual" != "$OPENELIS_PINNED_COMMIT" ]; then
            echo "::error::OpenELIS-Global-2 tag $OPENELIS_PINNED_TAG resolved to $actual, expected $OPENELIS_PINNED_COMMIT -- the upstream tag moved or was force-pushed"
            exit 1
          fi
          git -C "$OPENELIS_SRC" submodule update --init --depth 1 dataexport

      - name: Apply the production patches (the same files openelis-config/Dockerfile consumes)
        run: |
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/ServiceRequestProvider.java.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/ServiceRequestProviderCancel.java.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/PatientProvider.java.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/FhirTransformServiceImpl.java.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/LiquibaseConfig.java.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/base-changelog.xml.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/ElectronicOrder.hbm.xml.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/SampleEditService.java.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/SampleEditServiceImpl.java.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/SampleEditRestController.java.patch"
          git -C "$OPENELIS_SRC" apply "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/persistence.xml.patch"

          mkdir -p "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/dao"
          mkdir -p "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/daoimpl"
          mkdir -p "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/service"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherOrderCorrelation.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/DaherOrderCorrelation.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherOrderCorrelationTransaction.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/DaherOrderCorrelationTransaction.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherAnalysisCorrelation.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/DaherAnalysisCorrelation.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherAddedTestTransaction.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/DaherAddedTestTransaction.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherCancellationTransaction.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/DaherCancellationTransaction.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherAnalysisCorrelationDAO.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/dao/DaherAnalysisCorrelationDAO.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherAnalysisCorrelationDAOImpl.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/daoimpl/DaherAnalysisCorrelationDAOImpl.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherAnalysisCorrelationService.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/service/DaherAnalysisCorrelationService.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherAnalysisCorrelationServiceImpl.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/service/DaherAnalysisCorrelationServiceImpl.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherPatientIdentity.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/DaherPatientIdentity.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherPatientIdentityTransaction.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/DaherPatientIdentityTransaction.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherPatientIdentityDAO.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/dao/DaherPatientIdentityDAO.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherPatientIdentityDAOImpl.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/daoimpl/DaherPatientIdentityDAOImpl.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherPatientIdentityService.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/service/DaherPatientIdentityService.java"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/DaherPatientIdentityServiceImpl.java" \
            "$OPENELIS_SRC/src/main/java/org/openelisglobal/dataexchange/fhir/service/DaherPatientIdentityServiceImpl.java"

          mkdir -p "$OPENELIS_SRC/src/main/resources/liquibase/daher"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/001-electronic-order-daher-correlation-unique.xml" \
            "$OPENELIS_SRC/src/main/resources/liquibase/daher/001-electronic-order-daher-correlation-unique.xml"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/002-site-code-configuration.xml" \
            "$OPENELIS_SRC/src/main/resources/liquibase/daher/002-site-code-configuration.xml"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/003-electronic-order-external-id-widen.xml" \
            "$OPENELIS_SRC/src/main/resources/liquibase/daher/003-electronic-order-external-id-widen.xml"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/004-daher-analysis-correlation.xml" \
            "$OPENELIS_SRC/src/main/resources/liquibase/daher/004-daher-analysis-correlation.xml"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/005-daher-analysis-correlation-unique-analysis.xml" \
            "$OPENELIS_SRC/src/main/resources/liquibase/daher/005-daher-analysis-correlation-unique-analysis.xml"
          cp "$GITHUB_WORKSPACE/openelis-config/patches/order-correlation/006-daher-patient-identity.xml" \
            "$OPENELIS_SRC/src/main/resources/liquibase/daher/006-daher-patient-identity.xml"

      - name: Compile the patched reactor through to a produced WAR
        # Mirrors openelis-config/Dockerfile's own build recipe (its BuildKit cache mounts
        # become the actions/cache step above; every mvn invocation and flag is identical).
        working-directory: /tmp/openelis-src
        run: |
          ./install/createDefaultPassword.sh -c -p adminADMIN!

          cd dataexport/dataexport-core
          mvn -B dependency:go-offline
          mvn -B clean install -DskipTests
          cd ../
          mvn -B dependency:go-offline
          mvn -B clean install -DskipTests
          mkdir -p /tmp/openelis-src/dataexport-m2/org
          cp -r /root/.m2/repository/org/itech /tmp/openelis-src/dataexport-m2/org/

          cd /tmp/openelis-src
          mvn -B dependency:go-offline
          mvn -B clean install -Dmaven.test.skip=true -DskipITs=true -Dspotless.check.skip=true
          test -s /tmp/openelis-src/target/OpenELIS-Global.war \
            || { echo "::error::patched reactor did not produce target/OpenELIS-Global.war"; exit 1; }
          echo "ok — patched OpenELIS-Global-2 reactor compiled and produced OpenELIS-Global.war"

  oauth2login-provider-tests:
    # DH-008G-CI / Bug #25. The static guards above prove the committed patches'
    # *text* has the right shape (method exists, exact-match constant, fails
    # closed, no competing mapper) -- it never compiles or runs a single line
    # of the patched Java. This job is the behavioral companion: it fetches
    # the exact pinned oauth2login source, verifies the commit, applies the
    # SAME committed patch files openmrs-config/Dockerfile consumes (not a
    # test-only approximation), and actually executes
    # ProviderRoleDerivationTest's 10 cases and FirstLoginAuthenticationTest's
    # 3 cases. Static guards + this job together;
    # neither replaces the other.
    #
    # Runs inside the exact pinned Maven/JDK image the Dockerfile itself
    # builds with, not a generic runner toolchain -- byte-identical to
    # production, not "close enough".
    #
    # ProviderAttributeUserInfoTest (the other test-verification artifact) is
    # deliberately NOT run here: it's a full Spring-context integration test
    # (extends BaseModuleContextSensitiveTest) that fails to load its
    # ApplicationContext under this exact JDK17/CGLIB combination -- the same
    # pre-existing failure ADR-017E2 already found and confirmed via a
    # control run against pristine, unpatched upstream source (not caused by
    # either patch). Gating CI on infrastructure this repo does not own and
    # cannot fix would make the gate flaky, not stronger. It stays a
    # documented, manually-verified artifact (PROVENANCE.md) exactly as
    # before.
    name: oauth2login — patched identity tests
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.11-eclipse-temurin-17@sha256:e4a7ace3dc0d645ed97f8d9ad0b0d3f0b14fa8d150138f27f116d7105a639b82
    env:
      # Same pin openmrs-config/Dockerfile and PROVENANCE.md record. Not read
      # from those files at run time on purpose -- a moving reference here
      # would silently stop testing what actually ships. If the pin ever
      # changes, this line must change with it, deliberately, in the same
      # commit as the Dockerfile.
      OAUTH2LOGIN_PINNED_COMMIT: 2770233627343a53719ec981e997d94b1d90b7ad
      OAUTH2LOGIN_SRC: /tmp/oauth2login-src
    steps:
      - uses: actions/checkout@v5

      # Standard actions/cache mechanism, keyed on the pinned commit -- that
      # commit fully determines the dependency set (a fixed upstream pom.xml
      # at a fixed SHA), so the key never goes stale and never needs manual
      # invalidation.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: /root/.m2/repository
          key: m2-oauth2login-${{ env.OAUTH2LOGIN_PINNED_COMMIT }}

      - name: Fetch exact pinned oauth2login source and verify the commit
        run: |
          git clone --branch 1.5.0 --depth 1 \
            https://github.com/openmrs/openmrs-module-oauth2login.git "$OAUTH2LOGIN_SRC"
          actual="$(git -C "$OAUTH2LOGIN_SRC" rev-parse HEAD)"
          if [ "$actual" != "$OAUTH2LOGIN_PINNED_COMMIT" ]; then
            echo "::error::oauth2login tag 1.5.0 resolved to $actual, expected $OAUTH2LOGIN_PINNED_COMMIT -- the upstream tag moved or was force-pushed"
            exit 1
          fi

      - name: Apply the production patches (the same files the Docker build consumes)
        run: |
          cp openmrs-config/patches/oauth2login-bridge/OAuth2LoginBridgeFilter.java \
            "$OAUTH2LOGIN_SRC/omod/src/main/java/org/openmrs/module/oauth2login/web/filter/OAuth2LoginBridgeFilter.java"
          git -C "$OAUTH2LOGIN_SRC" apply "$GITHUB_WORKSPACE/openmrs-config/patches/oauth2login-bridge/config.xml.patch"
          git -C "$OAUTH2LOGIN_SRC" apply "$GITHUB_WORKSPACE/openmrs-config/patches/oauth2login-bridge/OAuth2LoginController.java.patch"
          git -C "$OAUTH2LOGIN_SRC" apply "$GITHUB_WORKSPACE/openmrs-config/patches/oauth2login-bridge/OAuth2UserInfoAuthenticationScheme.java.patch"

      - name: Install the identity test-verification artifacts
        run: |
          cp openmrs-config/patches/oauth2login-bridge/test-verification/ProviderRoleDerivationTest.java \
            "$OAUTH2LOGIN_SRC/omod/src/test/java/org/openmrs/module/oauth2login/web/controller/ProviderRoleDerivationTest.java"
          cp openmrs-config/patches/oauth2login-bridge/test-verification/FirstLoginAuthenticationTest.java \
            "$OAUTH2LOGIN_SRC/api/src/test/java/org/openmrs/module/oauth2login/authscheme/FirstLoginAuthenticationTest.java"

      - name: Compile the affected modules and run the focused identity tests
        # package, not test: the omod module's own reactor build needs the
        # api module already packaged (an unpack-dependencies step fails on
        # a reactor artifact that only reached the test phase) -- package
        # still runs surefire first, so tests execute exactly the same way.
        working-directory: /tmp/oauth2login-src
        run: |
          mvn -B -f pom.xml -pl omod -am \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=FirstLoginAuthenticationTest,ProviderRoleDerivationTest \
            package | tee /tmp/mvn-output.log
          # Every line Maven prints is "[INFO] ..." -- this must not be
          # anchored to the start of the line, and must be tied to the
          # specific class (not just any "Tests run: 10" elsewhere in the
          # log), or a passing-looking but wrong-scoped run would slip by.
          grep -qE 'Tests run: 10, Failures: 0, Errors: 0, Skipped: 0.*ProviderRoleDerivationTest' /tmp/mvn-output.log \
            || { echo "::error::expected exactly 10 passing ProviderRoleDerivationTest cases"; exit 1; }
          grep -qE 'Tests run: 3, Failures: 0, Errors: 0, Skipped: 0.*FirstLoginAuthenticationTest' /tmp/mvn-output.log \
            || { echo "::error::expected exactly 3 passing FirstLoginAuthenticationTest cases"; exit 1; }

  compose:
    name: compose interpolates and parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate a throwaway env file
        run: |
          # The compose file guards 17 variables with ${VAR:?} so a missing value
          # fails loudly at `up` instead of quietly selecting a published default
          # (bug 14). That guard is exactly why CI cannot use .env.example, which
          # correctly ships those values EMPTY.
          #
          # These are not secrets and are never used against a real service — they
          # exist so `${VAR:?}` has something to interpolate. `config` does not
          # validate password content, so they are deliberately kept SHORT: under
          # the tracked-secret scan's 12-character threshold, so this workflow does
          # not trip its own check. Excluding .github/ from that scan would have
          # been the lazy fix and would blind it to a real token pasted into CI.
          #
          # Written OUTSIDE the checkout and passed with --env-file, so running
          # this workflow locally (act) can never overwrite a developer's real
          # .env. That file holds live credentials.
          cat > "$RUNNER_TEMP/ci.env" <<'ENVEOF'
          BASE_DOMAIN=localhost
          OMRS_DB_NAME=openmrs
          OMRS_DB_USER=openmrs
          OMRS_DB_PASSWORD=ci-dummy
          OMRS_DB_ROOT_PASSWORD=ci-dummy
          OMRS_ADMIN_PASSWORD=CiDummy1
          OE_DB_PASSWORD=ci-dummy
          OE_DB_SUPERUSER_PASSWORD=ci-dummy
          OE_POSTGRES_PASSWORD=ci-dummy
          OE_ADMIN_PASSWORD=CiTest1!
          OE_KEYSTORE_PASSWORD=ci-dummy
          OE_TRUSTSTORE_PASSWORD=ci-dummy
          KEYCLOAK_DB_PASSWORD=ci-dummy
          KEYCLOAK_ADMIN_PASSWORD=ci-dummy
          KEYCLOAK_OPENMRS_CLIENT_SECRET=ci-dummy
          KEYCLOAK_ADAPTER_CLIENT_SECRET=ci-dummy
          ADAPTER_DB_PASSWORD=ci-dummy
          ENVEOF
      - name: Default profile parses
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" config -q
      - name: backup profile parses
        run: COMPOSE_PROFILES=backup docker compose --env-file "$RUNNER_TEMP/ci.env" config -q
      - name: Demo compose parses
        run: docker compose -f provisioning/demo/docker-compose.demo.yml config -q
      - name: A real .env must never have appeared in the checkout
        run: |
          test ! -f .env || { echo "::error::a .env exists in the checkout"; exit 1; }
          rm -f "$RUNNER_TEMP/ci.env"; echo ok
